<!DOCTYPE html>
<html lang="hi">
<head>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; }
        .navbar button:hover { background-color: rgba(255,255,255,0.1); }
        .navbar button.active { background-color: #ff9800; color: white; }
        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: auto; }
        .tab-content.active { display: block; }

        /* Top Feature Bar */
        .top-feature-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .feature-dropdown-container { position: relative; display: inline-block; }
        .feature-btn { background: #1e3c72; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.2s; }
        .feature-btn:hover { background: #2a5298; }

        /* Dropdown Content Boxes with Smooth Fade/Scale Animation */
        .dropdown-panel { 
            display: none; 
            position: absolute; 
            background: #fff; 
            min-width: 320px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.2); 
            border-radius: 12px; 
            z-index: 100; 
            left: 0; 
            top: 55px; 
            padding: 15px; 
            border-top: 4px solid #ff9800;
            opacity: 0;
            transform: translateY(-10px) scale(0.98);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .dropdown-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .dropdown-panel select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; margin-top: 5px; }

        /* Slider & Tithi Section */
        .event-slider-card { background: #fff; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 5px solid #0083b0; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .event-header-title { font-size: 20px; font-weight: bold; color: #0083b0; margin-bottom: 15px; background: #e0f7fa; padding: 8px 20px; border-radius: 20px; }
        .slider-content-box { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .slider-img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #0083b0; box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .slider-details { text-align: left; max-width: 500px; font-size: 14px; line-height: 1.6; }

        /* Comment Box Section */
        .comment-section { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 15px; margin-top: 20px; width: 100%; box-sizing: border-box; }
        .comment-section textarea { width: 100%; height: 70px; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; resize: none; box-sizing: border-box; }
        .comment-submit-btn { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; float: right; }

        /* Form Card & Tree */
        .form-card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2a5298; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #1e3c72; border-bottom: 2px solid #ff9800; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; }
        .submit-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        .tree-container { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .pdf-btn { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .zoom-controls { display: flex; gap: 6px; align-items: center; }
        .zoom-btn { background: #2a5298; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        
        /* 🌟 Premium Gradient Professional Scrollbar */
        .chart-scroll-wrapper { 
            width: 100%; 
            height: 600px; 
            overflow: auto; 
            background: #f8fafc; 
            border-radius: 12px; 
            padding: 30px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        /* Webkit scrollbar design (Chrome, Edge, Safari) */
        .chart-scroll-wrapper::-webkit-scrollbar {
            width: 8px;  
            height: 8px; 
        }

        .chart-scroll-wrapper::-webkit-scrollbar-track {
            background: #edf2f7; 
            border-radius: 10px;
        }

        .chart-scroll-wrapper::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #1e3c72 0%, #ff9800 100%); 
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .chart-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #ff416c 0%, #ff9800 100%);
        }

        /* Firefox scrollbar design */
        .chart-scroll-wrapper {
            scrollbar-width: thin;
            scrollbar-color: #ff9800 #edf2f7;
        }

        #chart_wrapper_inner { transform: scaleY(-1) scale(0.5); transform-origin: center center; transition: transform 0.25s ease; }
        #chart_div { display: flex; justify-content: center; }
        
        .node-content-box { transform: scaleY(-1); display: flex; flex-direction: column; align-items: center; justify-content: center; width: 140px; padding: 8px 6px; box-sizing: border-box; text-align: center; word-wrap: break-word; overflow: hidden; }
        .google-visualization-orgchart-node { cursor: pointer !important; color: #ffffff !important; border: 2px solid #ffffff !important; border-radius: 14px !important; padding: 4px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .gen-0-node { background: linear-gradient(135deg, #b5370e 0%, #851c07 100%) !important; }
        .gen-1-node { background: linear-gradient(135deg, #1b365d 0%, #0f1f38 100%) !important; }
        .gen-2-node { background: linear-gradient(135deg, #0f5132 0%, #082c1b 100%) !important; }
        .gen-3-node { background: linear-gradient(135deg, #581845 0%, #2e0c24 100%) !important; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background: #ffffff; margin: 5% auto; padding: 25px 20px; border-radius: 16px; width: 90%; max-width: 450px; position: relative; border-top: 6px solid #11998e; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; }
        .edit-profile-btn { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 12px; }
        
        #cropperModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .cropper-container-box { background: #fff; width: 90%; max-width: 400px; margin: 10% auto; padding: 20px; border-radius: 12px; text-align: center; }
        .img-container { max-height: 300px; margin-bottom: 15px; }
        .img-container img { max-width: 100%; display: block; }
        .crop-action-btn { background: #2a5298; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>

<body>

    <input type="file" id="popupPhotoFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'popup')">

    <div id="cropperModal">
        <div class="cropper-container-box">
            <h3 style="margin-top:0; color:#1e3c72;" id="cropTitleText">फोटो क्रॉप करें</h3>
            <div class="img-container"><img id="imageToCrop" src=""></div>
            <button class="crop-action-btn" onclick="getCroppedImage()" id="cropBtnText">Crop & Save</button>
        </div>
    </div>

    <div class="navbar">
        <button id="navTreeBtn" class="active" onclick="openTab(event, 'treePage')">🌳 Family Tree & Updates</button>
        <button id="navEntryBtn" onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content active">
        
        <!-- Top Feature Bar -->
        <div class="top-feature-bar">
            <!-- Language Dropdown -->
            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('langPanel')" id="langBtnText">🌐 Language (भाषा)</button>
                <div id="langPanel" class="dropdown-panel">
                    <label id="selectLangLabel">Select Language:</label>
                    <select id="langSelector" onchange="changeLanguage(this.value)">
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>

            <!-- Birthday / Tithi Dropdown -->
            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('tithiPanel')" id="tithiBtnText">📅 जन्मदिन / पुण्य तिथि</button>
                <div id="tithiPanel" class="dropdown-panel">
                    <label id="selectMemberLabel">सदस्य चुनें (Select Member):</label>
                    <select id="tithiSelectDropdown" onchange="selectMemberFromTithi(this.value)">
                        <option value="">-- लोड हो रहा है --</option>
                    </select>
                </div>
            </div>

            <!-- Member Search Dropdown -->
            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('searchPanel')" id="searchBtnText">🔍 मेंबर सर्च (अगली पीढ़ी)</button>
                <div id="searchPanel" class="dropdown-panel">
                    <label id="searchMemberLabel">सदस्य सर्च करें:</label>
                    <select id="memberSearchDropdown" onchange="filterNextGenTree(this.value)">
                        <option value="">-- पूरा ट्री देखें --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 7 Days Upcoming Events Slider Widget -->
        <div class="event-slider-card" id="upcomingSliderWidget">
            <div class="event-header-title" id="sliderHeaderTitle">✨ आगामी 7 दिन - जन्मदिन / पुण्य तिथि</div>
            <div class="slider-content-box" id="sliderBodyContainer">
                <p id="loadingText">डाटा लोड हो रहा है...</p>
            </div>
            
            <!-- Comment Box Section Inside Widget -->
            <div class="comment-section">
                <label id="commentBoxLabel" style="font-size:13px; text-align:left; color:#1e3c72; font-weight:bold;">जन्मदिन / श्रद्धांजलि अर्पित करें (कमेंट बॉक्स):</label>
                <textarea id="visitorComment" placeholder="अपनी शुभकामनाएँ या संदेश यहाँ लिखें..."></textarea>
                <button class="comment-submit-btn" id="sendMsgBtn" onclick="postComment()">संदेश भेजें</button>
            </div>
        </div>

        <!-- Family Tree Section -->
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#1e3c72;" id="treeHeadingTitle">परिवार का स्वर्णिम इतिहास</h2>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomTree(0.15)" id="zoomPlusBtn">➕ ज़ूम+</button>
                        <button class="zoom-btn" onclick="zoomTree(-0.15)" id="zoomMinusBtn">➖ ज़ूम-</button>
                        <button class="zoom-btn" onclick="resetZoom()" id="zoomResetBtn">↺ रीसेट</button>
                    </div>
                    <button class="pdf-btn" onclick="downloadPDF()" id="pdfBtnText">📥 Save as PDF</button>
                </div>
            </div>
            
            <div id="pdfContent" style="background: #fff; padding: 20px; border-radius: 10px;">
                <h3 style="text-align: center; color: #1e3c72; display:none;" id="pdfTitle">Family Tree Report</h3>
                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="chart_wrapper_inner">
                        <div id="chart_div">
                            <div id="treeLoadingText" style="text-align:center; padding:50px; color:#666; font-weight:bold; transform: scaleY(-1);">
                                Family Tree Load ho raha hai...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2 id="formTitleText">Naye Member ki Entry Karein</h2>
            <form id="entryForm">
                <div class="form-group">
                    <label id="lblFather">Father / Parent:*</label>
                    <select id="fatherId" required><option value="">-- Select --</option></select>
                </div>
                <div class="form-group">
                    <label id="lblName">Member Name:*</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label id="lblGender">Gender:</label>
                    <select id="gender">
                        <option value="Male" id="optMale">Male</option>
                        <option value="Female" id="optFemale">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lblDob">D.O.B:</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label id="lblAliveDeath">Alive / Death:</label>
                    <select id="aliveDeath" onchange="toggleDeathFields('member')">
                        <option value="Alive" id="optAlive">Alive</option>
                        <option value="Death" id="optDeath">Death</option>
                    </select>
                </div>
                <div id="memberDeathContainer" style="display:none;">
                    <div class="form-group"><label id="lblDeathDate">Death Date:</label><input type="date" id="deathAnniversary"></div>
                    <div class="form-group"><label id="lblDeathDay">Death Day:</label><input type="text" id="deathDay"></div>
                    <div class="form-group"><label id="lblDeathTithi">Death Tithi:</label><input type="text" id="deathTithi"></div>
                </div>
                <div class="form-group">
                    <label id="lblMarital">Marital Status:*</label>
                    <select id="maritalStatus" onchange="toggleSpouseFields()">
                        <option value="Married" id="optMarried">Married</option>
                        <option value="Unmarried" id="optUnmarried">Unmarried</option>
                    </select>
                </div>
                <div id="spouseFieldsContainer">
                    <div class="form-group"><label id="lblSpouseName">Spouse Name:</label><input type="text" id="spouseName"></div>
                    <div class="form-group"><label id="lblSpouseDob">Spouse D.O.B:</label><input type="date" id="spouseDob"></div>
                    <div class="form-group">
                        <label id="lblSpouseAliveDeath">Spouse Alive/Death:</label>
                        <select id="spouseAliveDeath" onchange="toggleDeathFields('spouse')">
                            <option value="Alive" id="optSpouseAlive">Alive</option>
                            <option value="Death" id="optSpouseDeath">Death</option>
                        </select>
                    </div>
                    <div id="spouseDeathContainer" style="display:none;">
                        <div class="form-group"><label id="lblSpouseDeathDate">Spouse Death Date:</label><input type="date" id="spouseDeathAnniv"></div>
                        <div class="form-group"><label id="lblSpouseDeathDay">Death Day:</label><input type="text" id="spouseDeathDay"></div>
                        <div class="form-group"><label id="lblSpouseDeathTithi">Death Tithi:</label><input type="text" id="spouseDeathTithi"></div>
                    </div>
                </div>
                <div class="form-group"><label id="lblMobile">Mobile:</label><input type="tel" id="mobile"></div>
                <div class="form-group"><label id="lblPhoto">Photo:</label><input type="file" id="photoFile" accept="image/*" onchange="handleFileSelect(this, 'entry')"></div>
                <button type="submit" class="submit-btn" id="submitBtnText">Submit & Save</button>
            </form>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

            let panels = document.getElementsByClassName('dropdown-panel');
            for(let p of panels) { 
                if(p.id !== id) {
                    p.classList.remove('show');
                    setTimeout(() => { if(!p.classList.contains('show')) p.style.display = 'none'; }, 300);
                }
            }
            let panel = document.getElementById(id);
            if(panel.classList.contains('show')) {
                panel.classList.remove('show');
                setTimeout(() => { if(!panel.classList.contains('show')) panel.style.display = 'none'; }, 300);
            } else {
                panel.style.display = 'block';
                setTimeout(() => panel.classList.add('show'), 10);
            }
        }

        function zoomTree(amount) {
            currentScale += amount;
            if (currentScale < 0.25) currentScale = 0.25; 
            if (currentScale > 1.2) currentScale = 1.2; 
            document.getElementById('chart_wrapper_inner').style.transform = `scaleY(-1) scale(${currentScale})`;
        }

        function resetZoom() {
            currentScale = 0.5;
            document.getElementById('chart_wrapper_inner').style.transform = `scaleY(-1) scale(${currentScale})`;
            centerTreeScroll();
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            let dPart = String(dateStr).split('T')[0];
            let parts = dPart.split('-');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return dPart;
        }

        function toggleDeathFields(type) {
            if (type === 'member') {
                let status = document.getElementById('aliveDeath').value;
                document.getElementById('memberDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            } else if (type === 'spouse') {
                let status = document.getElementById('spouseAliveDeath').value;
                document.getElementById('spouseDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            }
        }

        function toggleSpouseFields() {
            let status = document.getElementById('maritalStatus').value;
            document.getElementById('spouseFieldsContainer').style.display = (status === 'Married') ? 'block' : 'none';
        }

        function handleFileSelect(input, type) {
            activeUploadType = type;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageElement = document.getElementById('imageToCrop');
                    imageElement.src = e.target.result;
                    document.getElementById('cropperModal').style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageElement, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.9 });
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCroppedImage() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 250, height: 250 });
            finalProcessedPhoto = canvas.toDataURL('image/jpeg', 0.8);
            document.getElementById('cropperModal').style.display = 'none';
            if (activeUploadType === 'popup' && currentEditingMemberId) {
                updateMemberPhotoOnServer(currentEditingMemberId, finalProcessedPhoto);
            }
        }

        function openTab(evt, tabName) {
            let contents = document.getElementsByClassName("tab-content");
            for (let c of contents) c.classList.remove("active");
            let buttons = document.getElementsByClassName("navbar")[0].getElementsByTagName("button");
            for (let b of buttons) b.classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
            if (tabName === 'treePage') setTimeout(centerTreeScroll, 150);
        }

        google.charts.load('current', {packages:['orgchart']});
        google.charts.setOnLoadCallback(fetchFamilyData);

        function fetchFamilyData() {
            fetch(scriptURL + '?action=getData')
                .then(res => res.json())
                .then(data => {
                    globalData = data;
                    document.getElementById('treeLoadingText').style.display = 'none';
                    populateDropdowns(data);
                    processUpcomingEvents(data);
                    drawChart(data);
                })
                .catch(err => console.error("Error loading data:", err));
        }

        function populateDropdowns(data) {
            let tithiSelect = document.getElementById('tithiSelectDropdown');
            let searchSelect = document.getElementById('memberSearchDropdown');
            let fatherSelect = document.getElementById('fatherId');
            
            if(!tithiSelect || !searchSelect || !fatherSelect) return;

            tithiSelect.innerHTML = `<option value="">-- ${currentLang === 'hi' ? 'सदस्य चुनें' : 'Select Member'} --</option>`;
            searchSelect.innerHTML = `<option value="">-- ${currentLang === 'hi' ? 'पूरा ट्री देखें' : 'View Full Tree'} --</option>`;
            fatherSelect.innerHTML = `<option value="">-- ${currentLang === 'hi' ? 'सेलेक्ट करें' : 'Select Parent'} --</option>`;

            let targetData = (data && data.length > 0) ? data : globalData;

            targetData.forEach(item => {
                let combinedNameLabel = item.name;
                if(item.maritalStatus === 'Married' && item.spouseName) {
                    combinedNameLabel += ` & ${item.spouseName}`;
                }

                // 🌟 Name and ID Stacked Format using Unicode/Symbols for Clean Option Presentation
                let opt1 = document.createElement('option');
                opt1.value = item.memberId;
                opt1.textContent = `${combinedNameLabel} ➔ [ ID: ${item.memberId} ]`;
                tithiSelect.appendChild(opt1);

                let opt2 = document.createElement('option');
                opt2.value = item.name;
                opt2.textContent = `${item.name} (${currentLang === 'hi' ? 'अगली पीढ़ी' : 'Next Gen'})`;
                searchSelect.appendChild(opt2);

                let opt3 = document.createElement('option');
                opt3.value = item.name; 
                opt3.textContent = `${combinedNameLabel} ➔ [ ID: ${item.memberId} ]`;
                fatherSelect.appendChild(opt3);
            });
        }

        function selectMemberFromTithi(memberId) {
            if(!memberId) return;
            showDetails(memberId);
            let panel = document.getElementById('tithiPanel');
            panel.classList.remove('show');
            setTimeout(() => panel.style.display = 'none', 300);
        }

        function filterNextGenTree(selectedParentName) {
            let panel = document.getElementById('searchPanel');
            panel.classList.remove('show');
            setTimeout(() => panel.style.display = 'none', 300);

            if(!selectedParentName) {
                drawChart(globalData);
                return;
            }

            let filteredList = [];
            let queue = [selectedParentName];
            let addedNames = new Set();

            let rootMember = globalData.find(d => d.name === selectedParentName);
            if(rootMember) {
                filteredList.push(rootMember);
                addedNames.add(rootMember.name);
            }

            while(queue.length > 0) {
                let current = queue.shift();
                let children = globalData.filter(d => d.fatherId === current);
                children.forEach(child => {
                    if(!addedNames.has(child.name)) {
                        filteredList.push(child);
                        addedNames.add(child.name);
                        queue.push(child.name);
                    }
                });
            }

            drawChart(filteredList);
        }

        function processUpcomingEvents(data) {
            sliderEventsList = [];
            let today = new Date();
            
            data.forEach(item => {
                if(item.aliveDeath === 'Death' && item.deathAnniversary) {
                    let dDate = new Date(item.deathAnniversary);
                    if(isWithinNext7Days(today, dDate)) {
                        sliderEventsList.push({ type: currentLang === 'hi' ? 'पुण्य तिथि (Death Anniversary)' : 'Death Anniversary', item: item, date: dDate });
                    }
                }
                if(item.dob) {
                    let bDate = new Date(item.dob);
                    if(isWithinNext7Days(today, bDate)) {
                        sliderEventsList.push({ type: currentLang === 'hi' ? 'जन्मदिन (Birthday)' : 'Birthday', item: item, date: bDate });
                    }
                }
            });

            if(sliderEventsList.length > 0) {
                renderSliderItem(0);
                if(sliderEventsList.length > 1) {
                    setInterval(() => {
                        sliderIndex = (sliderIndex + 1) % sliderEventsList.length;
                        renderSliderItem(sliderIndex);
                    }, 5000);
                }
            } else {
                let t = dictionary[currentLang];
                document.getElementById('sliderHeaderTitle').innerText = t.noEventTitle;
                document.getElementById('sliderBodyContainer').innerHTML = `<p>${t.noEventDesc}</p>`;
            }
        }

        function isWithinNext7Days(today, targetDate) {
            let tMonth = today.getMonth();
            let tDay = today.getDate();
            let targetMonth = targetDate.getMonth();
            let targetDay = targetDate.getDate();

            if(tMonth === targetMonth && targetDay >= tDay && targetDay <= tDay + 7) {
                return true;
            }
            return false;
        }

        function renderSliderItem(index) {
            let ev = sliderEventsList[index];
            let item = ev.item;
            
            document.getElementById('sliderHeaderTitle').innerText = `✨ ${ev.type}`;
            
            let photoHtml = item.photo ? `<img src="${item.photo}" class="slider-img">` : `<div class="slider-img" style="display:flex; align-items:center; justify-content:center; background:#ddd; font-size:40px; color:#555;">${item.name.charAt(0)}</div>`;
            
            let t = dictionary[currentLang];
            let detailsHtml = `
                <h3 style="margin:0 0 8px 0; color:#1e3c72; font-size:18px;">${item.name} (ID: ${item.memberId})</h3>
                <div><strong>${t.fatherLabel}</strong> ${item.fatherId || 'Root'}</div>
                <div><strong>Date:</strong> ${formatDate(ev.type.includes('पुण्य') || ev.type.includes('Death') ? item.deathAnniversary : item.dob)}</div>
                <div><strong>${t.mobileLabel}</strong> ${item.mobile || 'N/A'}</div>
                <button class="edit-profile-btn" style="margin-top:8px; padding:5px 12px; font-size:12px;" onclick="showDetails('${item.memberId}')">${currentLang === 'hi' ? 'पूरी जानकारी देखें' : 'View Full Details'}</button>
            `;

            document.getElementById('sliderBodyContainer').innerHTML = `${photoHtml} <div class="slider-details">${detailsHtml}</div>`;
        }

        function postComment() {
            let text = document.getElementById('visitorComment').value;
            if(!text.trim()) { alert(currentLang === 'hi' ? 'कृपया कुछ संदेश लिखें!' : 'Please write a message!'); return; }
            alert(currentLang === 'hi' ? 'आपका संदेश / श्रद्धांजलि सफलता पूर्वक प्रेषित कर दी गई है!' : 'Your message/tribute has been sent successfully!');
            document.getElementById('visitorComment').value = '';
        }

        function drawChart(dataToDraw) {
            if (!dataToDraw || dataToDraw.length === 0) {
                document.getElementById('chart_div').innerHTML = `<div style="text-align:center; padding:30px;">${currentLang === 'hi' ? 'कोई डेटा उपलब्ध नहीं है।' : 'No data available.'}</div>`;
                return;
            }

            let chartData = new google.visualization.DataTable();
            chartData.addColumn('string', 'Entity');
            chartData.addColumn('string', 'Parent');
            chartData.addColumn('string', 'ToolTip');

            let rows = [];
            let nameSet = new Set(globalData.map(item => item.name));

            dataToDraw.forEach(item => {
                let pId = item.fatherId;
                if (!pId || !nameSet.has(pId)) pId = ''; 

                let genClass = 'gen-1-node';
                if (!pId) genClass = 'gen-0-node';
                else {
                    let parentObj = globalData.find(d => d.name === pId);
                    if (parentObj && !parentObj.fatherId) genClass = 'gen-2-node';
                    else genClass = 'gen-3-node';
                }

                let photoHtml = item.photo ? `<img src="${item.photo}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid #fff; margin-bottom:3px;">` : `<div style="width:40px; height:40px; border-radius:50%; background:#ddd; display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:bold; color:#555; margin-bottom:3px;">${item.name.charAt(0)}</div>`;
                
                let spouseText = (item.maritalStatus === 'Married' && item.spouseName) ? `<div style="font-size:10px; opacity:0.95; margin-top:2px; word-break: break-word;">${item.spouseName}</div>` : '';

                let nodeContent = `
                    <div class="node-content-box ${genClass}" onclick='showDetails("${item.memberId}")'>
                        ${photoHtml}
                        <div style="font-weight:bold; font-size:12px; word-break: break-word; line-height:1.2;">${item.name}</div>
                        ${spouseText}
                    </div>
                `;
                rows.push([{v: item.name, f: nodeContent}, pId, item.name]);
            });

            chartData.addRows(rows);
            let chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
            chart.draw(chartData, {allowHtml: true, nodeClass: 'google-visualization-orgchart-node'});

            setTimeout(centerTreeScroll, 250);
        }

        function centerTreeScroll() {
            let wrapper = document.getElementById('scrollWrapper');
            let inner = document.getElementById('chart_wrapper_inner');
            if (wrapper && inner) {
                wrapper.scrollLeft = (inner.scrollWidth - wrapper.clientWidth) / 2;
            }
        }

        function showDetails(memberId) {
            let item = globalData.find(d => d.memberId === memberId);
            if (!item) return;
            currentEditingMemberId = memberId;
            let t = dictionary[currentLang];

            let photoHtml = item.photo ? `<img src="${item.photo}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #2a5298; margin-bottom:10px;">` : `<div style="width:90px; height:90px; border-radius:50%; background:#e2e8f0; display:inline-flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold; color:#1e3c72; margin-bottom:10px;">${item.name.charAt(0)}</div>`;
            
            let deathInfo = item.aliveDeath === 'Death' ? `<div style="margin-top:6px; padding:8px; background:#fff5f5; border-left:4px solid #e53e3e; border-radius:4px;"><span style="color:#c53030; font-weight:bold;">${t.statusDeath}</span> ${formatDate(item.deathAnniversary)}<br><span style="color:#c53030; font-weight:bold;">${t.dayLabel}</span> ${item.deathDay || 'N/A'}<br><span style="color:#c53030; font-weight:bold;">${t.tithiLabel}</span> ${item.deathTithi || 'N/A'}</div>` : `<div style="margin-top:6px; padding:6px; background:#f0fff4; border-left:4px solid #38a169; border-radius:4px;"><span style="color:#2f855a; font-weight:bold;">Status:</span> ${t.statusAlive}</div>`;

            let html = `
                <div style="text-align:center;">
                    ${photoHtml}
                    <h3 style="margin:5px 0; color:#1e3c72; font-size:20px; font-weight:bold;">${item.name}</h3>
                    <div style="display:inline-block; background:#ebf8ff; color:#2b6cb0; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:bold;">ID: ${item.memberId}</div>
                </div>
                <hr style="border:0; border-top:1px solid #e2e8f0; margin:15px 0;">
                <div style="font-size:14px; line-height:1.7; color:#2d3748;">
                    <div style="padding:4px 8px; background:#f7fafc; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">${t.fatherLabel}</strong> ${item.fatherId || 'Root'}</div>
                    <div style="padding:4px 8px; background:#fff; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">${t.genderLabel}</strong> ${item.gender}</div>
                    <div style="padding:4px 8px; background:#f7fafc; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">${t.dobLabel}</strong> ${formatDate(item.dob)}</div>
                    <div style="padding:4px 8px; background:#fff; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">${t.maritalLabel}</strong> ${item.maritalStatus}</div>
                    ${item.maritalStatus === 'Married' ? `<div style="padding:6px 8px; background:#f7fafc; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">${t.spouseLabel}</strong> <span style="color:#742a2a; font-weight:600;">${item.spouseName || 'N/A'}</span></div>` : ''}
                    ${deathInfo}
                    <div style="padding:6px 8px; background:#f7fafc; border-radius:6px; margin-top:6px;"><strong style="color:#2a5298;">${t.mobileLabel}</strong> <a href="tel:${item.mobile}" style="color:#2b6cb0; text-decoration:none; font-weight:bold;">${item.mobile || 'N/A'}</a></div>
                </div>
                <div style="text-align:center; margin-top:18px;">
                    <button class="edit-profile-btn" onclick="document.getElementById('popupPhotoFile').click()">${t.editPhotoBtn}</button>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('detailsModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }

        function updateMemberPhotoOnServer(memberId, base64Photo) {
            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: 'updateMemberPhoto', memberId: memberId, photo: base64Photo })
            }).then(() => { alert(currentLang === 'hi' ? 'फोटो अपडेट हो गई!' : 'Photo updated successfully!'); location.reload(); });
        }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let formData = {
                fatherId: document.getElementById('fatherId').value,
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                deathDay: document.getElementById('deathDay').value,
                deathTithi: document.getElementById('deathTithi').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                spouseName: document.getElementById('spouseName').value,
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveDeath').value,
                spouseDeathAnniv: document.getElementById('spouseDeathAnniv').value,
                spouseDeathDay: document.getElementById('spouseDeathDay').value,
                spouseDeathTithi: document.getElementById('spouseDeathTithi').value,
                mobile: document.getElementById('mobile').value,
                photo: finalProcessedPhoto
            };
            fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
            .then(res => res.json())
            .then(data => { alert(currentLang === 'hi' ? 'एंट्री सेव हो गई है!' : 'Entry saved successfully!'); location.reload(); });
        });

        function downloadPDF() {
            let element = document.getElementById('pdfContent');
            let opt = { margin: 0.5, filename: 'Family_Tree.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } };
            document.getElementById('pdfTitle').style.display = 'block';
            html2pdf().from(element).set(opt).save().then(() => { document.getElementById('pdfTitle').style.display = 'none'; });
        }
