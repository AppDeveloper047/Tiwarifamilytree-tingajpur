<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning 3D Gradient Family Tree</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; letter-spacing: 0.5px; }
        .navbar button:hover { background-color: rgba(255,255,255,0.1); }
        .navbar button.active { background-color: #ff9800; color: white; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .tab-content { display: none; padding: 30px; max-width: 1200px; margin: auto; }
        .tab-content.active { display: block; }
        .form-card { background: #fff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2a5298; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #1e3c72; border-bottom: 2px solid #ff9800; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        .hint-text { display: block; font-size: 12px; color: #666; margin-top: 4px; font-style: italic; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; transition: 0.3s; }
        input:focus, select:focus { border-color: #2a5298; outline: none; box-shadow: 0 0 8px rgba(42,82,152,0.2); }
        .submit-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(17,153,142,0.3); }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .tree-container { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .pdf-btn { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(255,65,108,0.3); transition: 0.3s; }
        .chart-scroll-wrapper { width: 100%; overflow-x: auto; display: flex; justify-content: flex-start; padding: 20px 10px; min-height: 400px; }
        .google-visualization-orgchart-node { cursor: pointer !important; background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%) !important; color: white !important; border: 2px solid #ffffff !important; border-radius: 14px !important; box-shadow: 0 8px 20px rgba(78, 84, 200, 0.4), inset 0 2px 5px rgba(255,255,255,0.4) !important; padding: 10px !important; transition: all 0.3s ease !important; }
        .female-node { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%) !important; box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4), inset 0 2px 5px rgba(255,255,255,0.4) !important; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: linear-gradient(135deg, #fff 0%, #f9fbfd 100%); margin: 5% auto; padding: 25px; border-radius: 15px; width: 360px; max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.3); position: relative; text-align: center; border-top: 5px solid #11998e; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 18px; top: 12px; transition: 0.2s; }
    </style>
</head>
<body>

    <div class="navbar">
        <button id="defaultOpen" onclick="openTab(event, 'treePage')">🌳 Family Tree View</button>
        <button onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <!-- Tree View Page -->
    <div id="treePage" class="tab-content">
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#1e3c72;">परिवार का स्वर्णिम इतिहास</h2>
                <button class="pdf-btn" onclick="downloadPDF()">📥 Save as PDF</button>
            </div>
            <div id="pdfContent" style="background: #fff; padding: 20px;">
                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="chart_div"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Entry Form Page -->
    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2>Naye Member ki Entry Karein</h2>
            <form id="entryForm">
                <div class="form-group">
                    <label>Father I'd:</label>
                    <input type="text" id="fatherId">
                    <span class="hint-text">पिताजी की I'd यहाँ दर्ज करें।</span>
                </div>
                <div class="form-group">
                    <label>Member I'd:*</label>
                    <input type="text" id="memberId" required>
                    <span class="hint-text">स्वयं की यूनिक I'd बनाएं।</span>
                </div>
                <div class="form-group">
                    <label>Name:*</label>
                    <input type="text" id="name" required>
                    <span class="hint-text">सदस्य का पूरा नाम।</span>
                </div>
                <div class="form-group">
                    <label>Child Level:</label>
                    <input type="number" id="childOrder">
                    <span class="hint-text">संतान का क्रम नंबर।</span>
                </div>
                <div class="form-group">
                    <label>Gender:</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>D.O.B:</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Alive / Death:</label>
                    <select id="aliveDeath">
                        <option value="Alive">Alive</option>
                        <option value="Death">Death</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Marital Status:*</label>
                    <select id="maritalStatus" onchange="toggleSpouseFields()">
                        <option value="Married">Married</option>
                        <option value="Unmarried" selected>Unmarried</option>
                    </select>
                </div>

                <div id="spouseFieldsContainer" style="display: none;">
                    <div class="form-group">
                        <label>Spouse Name:</label>
                        <input type="text" id="spouseName">
                    </div>
                    <div class="form-group">
                        <label>Spouse D.O.B:</label>
                        <input type="date" id="spouseDob">
                    </div>
                    <div class="form-group">
                        <label>Spouse Status:</label>
                        <select id="spouseAliveDeath">
                            <option value="Alive">Alive</option>
                            <option value="Death">Death</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Mobile Number:</label>
                    <input type="tel" id="mobile">
                </div>
                <div class="form-group">
                    <label>Member Photo:</label>
                    <input type="file" id="photoFile" accept="image/*">
                </div>

                <button type="submit" class="submit-btn">Submit & Save</button>
            </form>
        </div>
    </div>

    <!-- Details Popup Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxSaAJ8pIrZz9nta8AG0sROBHXfVD1IIDDQgN3iaK3yM4evHWfnhvjhEr7QuBxvfK6DdQ/exec';
        let globalData = [];

        function toggleSpouseFields() {
            var status = document.getElementById('maritalStatus').value;
            document.getElementById('spouseFieldsContainer').style.display = (status === 'Unmarried') ? 'none' : 'block';
        }

        function openTab(event, tabName) {
            var i, tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
            
            var tablinks = document.getElementsByClassName("navbar")[0].getElementsByTagName("button");
            for (i = 0; i < tablinks.length; i++) tablinks[i].className = tablinks[i].className.replace(" active", "");
            
            document.getElementById(tabName).style.display = "block";
            event.currentTarget.className += " active";
        }
        document.getElementById("defaultOpen").click();

        google.charts.load('current', {packages:["orgchart"]});
        google.charts.setOnLoadCallback(fetchDataAndDrawChart);

        function fetchDataAndDrawChart() {
            fetch(scriptURL)
                .then(response => response.json())
                .then(jsonData => {
                    globalData = jsonData.map(row => ({
                        fatherId: row.fatherId || row[0] || '',
                        memberId: row.memberId || row[1] || '',
                        name: row.name || row[2] || '',
                        dob: row.dob || row[3] || '',
                        aliveDeath: row.aliveDeath || row[4] || 'Alive',
                        spouseName: row.spouseName || row[6] || '',
                        spouseDob: row.spouseDob || row[7] || '',
                        spouseAliveDeath: row.spouseAliveDeath || row[8] || 'Alive',
                        mobile: row.mobile || row[9] || '',
                        gender: row.gender || row[10] || 'Male',
                        photo: row.photo || row[13] || '',
                        childOrder: row.childOrder || row[12] || ''
                    }));
                    drawChart(globalData);
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        function drawChart(rowsData) {
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Member');
            data.addColumn('string', 'Father');
            data.addColumn('string', 'ToolTip');

            var rows = rowsData.map(row => {
                let photoURL = row.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                let shortView = `<div style="text-align:center;"><img src="${photoURL}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;"><br><b>${row.name}</b></div>`;
                return [{v: row.memberId, f: shortView}, row.fatherId, row.name];
            });

            data.addRows(rows);

            var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
            
            google.visualization.events.addListener(chart, 'select', () => {
                var selection = chart.getSelection();
                if (selection.length > 0) {
                    var selectedRowIndex = selection[0].row;
                    var selectedMemberId = data.getValue(selectedRowIndex, 0);
                    var memberInfo = globalData.find(m => m.memberId === selectedMemberId);
                    if (memberInfo) {
                        showPopup(memberInfo);
                    }
                }
            });

            chart.draw(data, {allowHtml:true, nodeClass: 'google-visualization-orgchart-node'});
        }

        function showPopup(info) {
            let maritalStatus = (info.spouseName && info.spouseName.trim() !== '' && info.spouseName !== '-') ? 'Married' : 'Unmarried';
            let modal = document.getElementById('detailsModal');
            let content = document.getElementById('modalContent');
            let photoURL = info.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            
            let spouseSection = '';
            if (maritalStatus === 'Married') {
                spouseSection = `
                    <hr style="margin: 15px 0; border:0; border-top:1px solid #ddd;">
                    <h4 style="color:#2a5298; margin-bottom:10px;">Spouse Details (जीवनसाथी)</h4>
                    <p style="text-align:left;"><b>Name:</b> ${info.spouseName}</p>
                    <p style="text-align:left;"><b>D.O.B:</b> ${info.spouseDob || '-'}</p>
                    <p style="text-align:left;"><b>Status:</b> ${info.spouseAliveDeath || 'Alive'}</p>
                `;
            }

            content.innerHTML = `
                <img src="${photoURL}" style="width:90px; height:90px; border-radius:50%; border:3px solid #11998e; object-fit:cover;">
                <h3 style="margin:10px 0; color:#1e3c72;">${info.name}</h3>
                
                <div style="background:#f9f9f9; padding:10px; border-radius:8px;">
                    <p style="text-align:left;"><b>Child Level:</b> No. ${info.childOrder || '-'}</p>
                    <p style="text-align:left;"><b>D.O.B:</b> ${info.dob || '-'}</p>
                    <p style="text-align:left;"><b>Marital Status:</b> <span style="color:#ff9800; font-weight:bold;">${maritalStatus}</span></p>
                    <p style="text-align:left;"><b>Status:</b> ${info.aliveDeath}</p>
                </div>

                ${spouseSection}
                <hr style="margin:15px 0; border:0; border-top:1px solid #eee;">
                <p style="font-size:14px; color:#666; text-align:left;"><b>Mobile:</b> ${info.mobile || '-'}</p>
            `;
            modal.style.display = "block";
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = "none";
        }

        window.onclick = function(event) {
            var modal = document.getElementById('detailsModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            html2pdf().from(element).save('FamilyTree.pdf');
        }

        document.getElementById('entryForm').addEventListener('submit', e => {
            e.preventDefault();
            const formData = {
                fatherId: document.getElementById('fatherId').value,
                memberId: document.getElementById('memberId').value,
                name: document.getElementById('name').value,
                childOrder: document.getElementById('childOrder').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                spouseName: document.getElementById('spouseName').value,
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveDeath').value,
                mobile: document.getElementById('mobile').value,
                photo: "" 
            };
            
            fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
                .then(response => {
                    alert('Data successfully saved!');
                    location.reload();
                })
                .catch(error => console.error('Error!', error.message));
        });
    </script>
</body>
</html>
