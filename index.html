<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree View</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; }
        .navbar button:hover { background-color: rgba(255,255,255,0.1); }
        .navbar button.active { background-color: #ff9800; color: white; }
        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: auto; }
        .tab-content.active { display: block; }
        .form-card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2a5298; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #1e3c72; border-bottom: 2px solid #ff9800; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; }
        input:focus, select:focus { border-color: #2a5298; outline: none; }
        .submit-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .tree-container { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .pdf-btn { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .zoom-controls { display: flex; gap: 6px; align-items: center; }
        .zoom-btn { background: #2a5298; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .chart-scroll-wrapper { width: 100%; overflow: auto; display: block; padding: 20px 10px; min-height: 600px; background: #f8fafc; border-radius: 12px; }
        #chart_wrapper_inner { transform: scaleY(-1) scale(0.45); transform-origin: center center; transition: transform 0.25s ease; display: inline-block; min-width: 100%; }
        #chart_div { display: inline-block; min-width: 100%; }
        
        /* Fixed Tree Box Padding & Shape */
        .node-content-box { transform: scaleY(-1); display: flex; flex-direction: column; align-items: center; justify-content: center; width: 130px; padding: 8px; box-sizing: border-box; text-align: center; }
        .google-visualization-orgchart-node { 
    cursor: pointer !important; 
    color: #ffffff !important; 
    border: 2px solid #ffffff !important; 
    border-radius: 50% !important; 
    width: 120px !important;
    height: 120px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 4px !important; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
}

        
        .gen-0-node { background: linear-gradient(135deg, #b5370e 0%, #851c07 100%) !important; }
        .gen-1-node { background: linear-gradient(135deg, #1b365d 0%, #0f1f38 100%) !important; }
        .gen-2-node { background: linear-gradient(135deg, #0f5132 0%, #082c1b 100%) !important; }
        .gen-3-node { background: linear-gradient(135deg, #581845 0%, #2e0c24 100%) !important; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background: #ffffff; margin: 5% auto; padding: 25px 20px; border-radius: 16px; width: 90%; max-width: 450px; position: relative; border-top: 6px solid #11998e; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; }
        .edit-profile-btn { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 12px; }
        
        #cropperModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .cropper-container-box { background: #fff; width: 90%; max-width: 400px; margin: 10% auto; padding: 20px; border-radius: 12px; text-align: center; }
        .img-container { max-height: 300px; margin-bottom: 15px; }
        .img-container img { max-width: 100%; display: block; }
        .crop-action-btn { background: #2a5298; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>

<body>

    <input type="file" id="popupPhotoFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'popup')">

    <div id="cropperModal">
        <div class="cropper-container-box">
            <h3 style="margin-top:0; color:#1e3c72;">फोटो क्रॉप करें (Adjust Face)</h3>
            <div class="img-container">
                <img id="imageToCrop" src="">
            </div>
            <button class="crop-action-btn" onclick="getCroppedImage()">Crop & Save</button>
        </div>
    </div>

    <div class="navbar">
        <button id="defaultOpen" onclick="openTab(event, 'treePage')">🌳 Family Tree View</button>
        <button onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content active">
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#1e3c72;">परिवार का स्वर्णिम इतिहास</h2>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomTree(0.15)">➕ ज़ूम+</button>
                        <button class="zoom-btn" onclick="zoomTree(-0.15)">➖ ज़ूम-</button>
                        <button class="zoom-btn" onclick="resetZoom()">↺ रीसेट</button>
                    </div>
                    <button class="pdf-btn" onclick="downloadPDF()">📥 Save as PDF</button>
                </div>
            </div>
            
            <div id="pdfContent" style="background: #fff; padding: 20px; border-radius: 10px;">
                <h3 style="text-align: center; color: #1e3c72; display:none;" id="pdfTitle">Family Tree Report</h3>
                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="chart_wrapper_inner">
                        <div id="chart_div">
                            <div style="text-align:center; padding:50px; color:#666; font-weight:bold; transform: scaleY(-1);">
                                Family Tree Load ho raha hai... Kripya prateeksha karein!
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2>Naye Member की Entry Karein</h2>
            <form id="entryForm">
                <div class="form-group">
                    <label>Father / Parent (पिता का पूरा नाम चुनें):*</label>
                    <select id="fatherId" required>
                        <option value="">-- Member List Load ho rahi hai --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Member Name (सदस्य का पूरा नाम):*</label>
                    <input type="text" id="name" placeholder="Member ka naam" required>
                </div>
                <div class="form-group">
                    <label>Child Level (संतान क्रम):</label>
                    <input type="number" id="childOrder" placeholder="Jaise: 1, 2, 3..." min="1">
                </div>
                <div class="form-group">
                    <label>Gender (लिंग):</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>D.O.B (जन्म दिनांक):</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Alive / Death (जीवित / स्वर्गवासी):</label>
                    <select id="aliveDeath" onchange="toggleDeathFields('member')">
                        <option value="Alive">Alive</option>
                        <option value="Death">Death</option>
                    </select>
                </div>
                <div id="memberDeathContainer" style="display:none;">
                    <div class="form-group">
                        <label>Death Date:</label>
                        <input type="date" id="deathAnniversary" onchange="autoFillDay(this.value, 'deathDay')">
                    </div>
                    <div class="form-group">
                        <label>Death Day / Vaar:</label>
                        <input type="text" id="deathDay" placeholder="Jaise: Somwar">
                    </div>
                    <div class="form-group">
                        <label>Death Tithi (Manual):</label>
                        <input type="text" id="deathTithi" placeholder="Jaise: Ekadashi">
                    </div>
                </div>
                <div class="form-group">
                    <label>Marital Status (विवाह की स्थिति):*</label>
                    <select id="maritalStatus" onchange="toggleSpouseFields()">
                        <option value="Married">Married</option>
                        <option value="Unmarried">Unmarried</option>
                    </select>
                </div>
                <div id="spouseFieldsContainer">
                    <div class="form-group">
                        <label>Spouse Name (पति/पत्नी का नाम):</label>
                        <input type="text" id="spouseName" placeholder="Spouse name">
                    </div>
                    <div class="form-group">
                        <label>Spouse D.O.B:</label>
                        <input type="date" id="spouseDob">
                    </div>
                    <div class="form-group">
                        <label>Spouse Alive / Death:</label>
                        <select id="spouseAliveDeath" onchange="toggleDeathFields('spouse')">
                            <option value="Alive">Alive</option>
                            <option value="Death">Death</option>
                        </select>
                    </div>
                    <div id="spouseDeathContainer" style="display:none;">
                        <div class="form-group">
                            <label>Spouse Death Date:</label>
                            <input type="date" id="spouseDeathAnniv" onchange="autoFillDay(this.value, 'spouseDeathDay')">
                        </div>
                        <div class="form-group">
                            <label>Spouse Death Day:</label>
                            <input type="text" id="spouseDeathDay" placeholder="Jaise: Mangalwar">
                        </div>
                        <div class="form-group">
                            <label>Spouse Death Tithi (Manual):</label>
                            <input type="text" id="spouseDeathTithi" placeholder="Jaise: Amavasya">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Mobile Number:</label>
                    <input type="tel" id="mobile" placeholder="Mobile number">
                </div>
                <div class="form-group">
                    <label>Member Photo:</label>
                    <input type="file" id="photoFile" accept="image/*" onchange="handleFileSelect(this, 'entry')">
                </div>
                <button type="submit" class="submit-btn">Submit & Save to Sheet</button>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxSaAJ8pIrZz9nta8AG0sROBHXfVD1IIDDQgN3iaK3yM4evHWfnhvjhEr7QuBxvfK6DdQ/exec';
        let globalData = [];
        let currentEditingMemberId = '';
        let cropper = null;
        let activeUploadType = ''; 
        let finalProcessedPhoto = '';
        let currentScale = 0.45;

        function zoomTree(amount) {
            currentScale += amount;
            if (currentScale < 0.2) currentScale = 0.2; 
            if (currentScale > 1.2) currentScale = 1.2; 
            document.getElementById('chart_wrapper_inner').style.transform = `scaleY(-1) scale(${currentScale})`;
        }

        function resetZoom() {
            currentScale = 0.45;
            document.getElementById('chart_wrapper_inner').style.transform = `scaleY(-1) scale(${currentScale})`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            let dPart = String(dateStr).split('T')[0];
            let parts = dPart.split('-');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dPart;
        }

        function autoFillDay(dateStr, targetInputId) {
            if (!dateStr) return;
            let date = new Date(dateStr);
            let hindiDays = ['रविवार (Sunday)', 'सोमवार (Monday)', 'मंगलवार (Tuesday)', 'बुधवार (Wednesday)', 'गुरुवार (Thursday)', 'शुक्रवार (Friday)', 'शनिवार (Saturday)'];
            let el = document.getElementById(targetInputId);
            if (el) el.value = hindiDays[date.getDay()];
        }

        function toggleDeathFields(type) {
            if (type === 'member') {
                let status = document.getElementById('aliveDeath').value;
                document.getElementById('memberDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            } else if (type === 'spouse') {
                let status = document.getElementById('spouseAliveDeath').value;
                document.getElementById('spouseDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            }
        }

        function toggleSpouseFields() {
            let status = document.getElementById('maritalStatus').value;
            document.getElementById('spouseFieldsContainer').style.display = (status === 'Married') ? 'block' : 'none';
        }

        function handleFileSelect(input, type) {
            activeUploadType = type;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageElement = document.getElementById('imageToCrop');
                    imageElement.src = e.target.result;
                    document.getElementById('cropperModal').style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageElement, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.9 });
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCroppedImage() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 250, height: 250 });
            finalProcessedPhoto = canvas.toDataURL('image/jpeg', 0.8);
            document.getElementById('cropperModal').style.display = 'none';
            if (activeUploadType === 'popup' && currentEditingMemberId) {
                updateMemberPhotoOnServer(currentEditingMemberId, finalProcessedPhoto);
            }
        }

        function openTab(evt, tabName) {
            let contents = document.getElementsByClassName("tab-content");
            for (let c of contents) c.classList.remove("active");
            let buttons = document.getElementsByClassName("navbar")[0].getElementsByTagName("button");
            for (let b of buttons) b.classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        google.charts.load('current', {packages:['orgchart']});
        google.charts.setOnLoadCallback(fetchFamilyData);

        function fetchFamilyData() {
            fetch(scriptURL + '?action=getData')
                .then(res => res.json())
                .then(data => {
                    globalData = data;
                    populateParentDropdown(data);
                    drawChart(data);
                })
                .catch(err => {
                    console.error("Error loading data:", err);
                    document.getElementById('chart_div').innerHTML = '<div style="color:red; text-align:center; padding:20px;">Data load karne mein samasya aayi.</div>';
                });
        }

        function populateParentDropdown(data) {
            let select = document.getElementById('fatherId');
            select.innerHTML = '<option value="">-- Mukhya (Root) Member --</option>';
            data.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.name; 
                let spouseLabel = (item.maritalStatus === 'Married' && item.spouseName) ? ` एवं ${item.spouseName}` : '';
                opt.textContent = `${item.name}${spouseLabel} (ID: ${item.memberId})`;
                select.appendChild(opt);
            });
        }

        function drawChart(data) {
            if (!data || data.length === 0) {
                document.getElementById('chart_div').innerHTML = '<div style="text-align:center; padding:30px;">Koi data uplabdh nahi hai.</div>';
                return;
            }

            let chartData = new google.visualization.DataTable();
            chartData.addColumn('string', 'Entity');
            chartData.addColumn('string', 'Parent');
            chartData.addColumn('string', 'ToolTip');

            let rows = [];
            let nameSet = new Set(data.map(item => item.name));

            data.forEach(item => {
                let pId = item.fatherId;
                if (!pId || !nameSet.has(pId)) pId = ''; 

                let genClass = 'gen-1-node';
                if (!pId) genClass = 'gen-0-node';
                else {
                    let parentObj = data.find(d => d.name === pId);
                    if (parentObj && !parentObj.fatherId) genClass = 'gen-2-node';
                    else genClass = 'gen-3-node';
                }

                let photoHtml = item.photo ? `<img src="${item.photo}" style="width:45px; height:45px; border-radius:50%; object-fit:cover; border:2px solid #fff; margin-bottom:4px;">` : `<div style="width:45px; height:45px; border-radius:50%; background:#ddd; display:inline-flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold; color:#555; margin-bottom:4px;">${item.name.charAt(0)}</div>`;
                let spouseText = (item.maritalStatus === 'Married' && item.spouseName) ? `<div style="font-size:10px; opacity:0.9; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;">Spouse: ${item.spouseName}</div>` : '';

                let nodeContent = `
                    <div class="node-content-box ${genClass}" onclick='showDetails("${item.memberId}")'>
                        ${photoHtml}
                        <div style="font-weight:bold; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;">${item.name}</div>
                        ${spouseText}
                    </div>
                `;
                rows.push([{v: item.name, f: nodeContent}, pId, item.name]);
            });

            chartData.addRows(rows);
            let chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
            chart.draw(chartData, {allowHtml: true, nodeClass: 'google-visualization-orgchart-node'});
        }

        function showDetails(memberId) {
            let item = globalData.find(d => d.memberId === memberId);
            if (!item) return;
            currentEditingMemberId = memberId;

            let photoHtml = item.photo ? `<img src="${item.photo}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #2a5298; margin-bottom:10px; box-shadow: 0 4px 8px rgba(0,0,0,0.15);">` : `<div style="width:90px; height:90px; border-radius:50%; background:#e2e8f0; display:inline-flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold; color:#1e3c72; margin-bottom:10px;">${item.name.charAt(0)}</div>`;
            
            let deathInfo = item.aliveDeath === 'Death' ? `<div style="margin-top:6px; padding:8px; background:#fff5f5; border-left:4px solid #e53e3e; border-radius:4px;"><span style="color:#c53030; font-weight:bold;">स्वर्गवास दिनांक:</span> ${formatDate(item.deathAnniversary)}<br><span style="color:#c53030; font-weight:bold;">वार:</span> ${item.deathDay || 'N/A'}<br><span style="color:#c53030; font-weight:bold;">तिथि:</span> ${item.deathTithi || 'N/A'}</div>` : '<div style="margin-top:6px; padding:6px; background:#f0fff4; border-left:4px solid #38a169; border-radius:4px;"><span style="color:#2f855a; font-weight:bold;">स्थिति:</span> जीवित (Alive)</div>';
            
            let spouseDeathInfo = '';
            if(item.maritalStatus === 'Married' && item.spouseAliveDeath === 'Death') {
                spouseDeathInfo = `<div style="margin-top:6px; padding:8px; background:#fff5f5; border-left:4px solid #e53e3e; border-radius:4px;"><span style="color:#c53030; font-weight:bold;">पति/पत्नी स्वर्गवास दिनांक:</span> ${formatDate(item.spouseDeathAnniv)}<br><span style="color:#c53030; font-weight:bold;">वार:</span> ${item.spouseDeathDay || 'N/A'}<br><span style="color:#c53030; font-weight:bold;">तिथि:</span> ${item.spouseDeathTithi || 'N/A'}</div>`;
            }

            let html = `
                <div style="text-align:center;">
                    ${photoHtml}
                    <h3 style="margin:5px 0; color:#1e3c72; font-size:20px; font-weight:bold;">${item.name}</h3>
                    <div style="display:inline-block; background:#ebf8ff; color:#2b6cb0; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:bold;">ID: ${item.memberId}</div>
                </div>
                <hr style="border:0; border-top:1px solid #e2e8f0; margin:15px 0;">
                <div style="font-size:14px; line-height:1.7; color:#2d3748;">
                    <div style="padding:4px 8px; background:#f7fafc; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">पिता का नाम:</strong> ${item.fatherId || 'Mukhya'}</div>
                    <div style="padding:4px 8px; background:#fff; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">लिंग:</strong> ${item.gender}</div>
                    <div style="padding:4px 8px; background:#f7fafc; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">जन्म दिनांक:</strong> ${formatDate(item.dob)}</div>
                    <div style="padding:4px 8px; background:#fff; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">विवाह स्थिति:</strong> ${item.maritalStatus}</div>
                    ${item.maritalStatus === 'Married' ? `<div style="padding:6px 8px; background:#f7fafc; border-radius:6px; margin-bottom:4px;"><strong style="color:#2a5298;">पति/पत्नी:</strong> <span style="color:#742a2a; font-weight:600;">${item.spouseName || 'N/A'}</span> <br><span style="font-size:12px; color:#555;">(DOB: ${formatDate(item.spouseDob)})</span></div>` : ''}
                    ${deathInfo}
                    ${spouseDeathInfo}
                    <div style="padding:6px 8px; background:#f7fafc; border-radius:6px; margin-top:6px;"><strong style="color:#2a5298;">मोबाइल नंबर:</strong> <a href="tel:${item.mobile}" style="color:#2b6cb0; text-decoration:none; font-weight:bold;">${item.mobile || 'N/A'}</a></div>
                </div>
                <div style="text-align:center; margin-top:18px;">
                    <button class="edit-profile-btn" onclick="document.getElementById('popupPhotoFile').click()">📷 फोटो बदलें</button>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('detailsModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }

        function updateMemberPhotoOnServer(memberId, base64Photo) {
            fetch(scriptURL + '?action=updateMember', {
                method: 'POST',
                body: JSON.stringify({ memberId: memberId, photo: base64Photo })
            })
            .then(res => res.json())
            .then(response => {
                if(response.status === 'success') { alert('फोटो अपडेट हो गई!'); location.reload(); }
                else { alert('त्रुटि हुई।'); }
            });
        }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let formData = {
                fatherId: document.getElementById('fatherId').value,
                name: document.getElementById('name').value,
                childOrder: document.getElementById('childOrder').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                deathDay: document.getElementById('deathDay').value,
                deathTithi: document.getElementById('deathTithi').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                spouseName: document.getElementById('spouseName').value,
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveDeath').value,
                spouseDeathAnniv: document.getElementById('spouseDeathAnniv').value,
                spouseDeathDay: document.getElementById('spouseDeathDay').value,
                spouseDeathTithi: document.getElementById('spouseDeathTithi').value,
                mobile: document.getElementById('mobile').value,
                photo: finalProcessedPhoto
            };

            let submitBtn = document.querySelector('.submit-btn');
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') { alert('Entry save ho gayi hai!'); location.reload(); }
                else { alert('Error: ' + data.message); submitBtn.textContent = 'Submit & Save to Sheet'; submitBtn.disabled = false; }
            });
        });

        function downloadPDF() {
            let element = document.getElementById('pdfContent');
            let opt = { margin: 0.5, filename: 'Family_Tree.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } };
            document.getElementById('pdfTitle').style.display = 'block';
            html2pdf().from(element).set(opt).save().then(() => { document.getElementById('pdfTitle').style.display = 'none'; });
        }
    </script>
</body>
</html>
