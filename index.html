<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning 3D Gradient Family Tree</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; min-height: 100vh; }
        
        .navbar { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; letter-spacing: 0.5px; }
        .navbar button:hover { background-color: rgba(255,255,255,0.1); }
        .navbar button.active { background-color: #ff9800; color: white; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }

        .tab-content { display: none; padding: 30px; max-width: 1200px; margin: auto; }
        .tab-content.active { display: block; }

        .form-card { background: #fff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2a5298; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #1e3c72; border-bottom: 2px solid #ff9800; padding-bottom: 12px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; transition: 0.3s; }
        input:focus, select:focus { border-color: #2a5298; outline: none; box-shadow: 0 0 8px rgba(42,82,152,0.2); }
        .submit-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(17,153,142,0.3); }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .contact-note { background: #fff3cd; border-left: 5px solid #ff9800; padding: 15px; border-radius: 8px; margin-top: 25px; font-size: 14px; color: #856404; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .contact-note a { color: #d35400; font-weight: bold; text-decoration: none; }
        .contact-note a:hover { text-decoration: underline; }

        .tree-container { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .pdf-btn { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(255,65,108,0.3); transition: 0.3s; }
        .pdf-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .chart-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: flex-start; 
            padding: 20px 50px; 
        }

        /* Male & Default Box Styling */
        .google-visualization-orgchart-node { 
            cursor: pointer !important; 
            background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%) !important; 
            color: white !important;
            border: 2px solid #ffffff !important; 
            border-radius: 14px !important; 
            box-shadow: 0 8px 20px rgba(78, 84, 200, 0.4), inset 0 2px 5px rgba(255,255,255,0.4) !important;
            padding: 10px !important;
            transition: all 0.3s ease !important;
        }
        .google-visualization-orgchart-node:hover {
            transform: translateY(-5px) scale(1.03);
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%) !important;
            box-shadow: 0 12px 25px rgba(255, 94, 98, 0.5) !important;
            border-color: #fff !important;
        }

        /* Female Light Pink Box Styling */
        .female-node {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%) !important;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4), inset 0 2px 5px rgba(255,255,255,0.4) !important;
        }
        .female-node:hover {
            background: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%) !important;
        }
        
        .google-visualization-orgchart-lineleft, .google-visualization-orgchart-lineright, .google-visualization-orgchart-linebottom {
            border-color: #4e54c8 !important;
            border-width: 3px !important;
        }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: linear-gradient(135deg, #fff 0%, #f9fbfd 100%); margin: 10% auto; padding: 30px; border-radius: 15px; width: 340px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); position: relative; text-align: center; border-top: 5px solid #11998e; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 18px; top: 12px; transition: 0.2s; }
        .close-btn:hover { color: #ff416c; }
    </style>
</head>
<body>

    <div class="navbar">
        <button id="defaultOpen" onclick="openTab(event, 'treePage')">🌳 Family Tree View</button>
        <button onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content">
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#1e3c72;">Family Tree</h2>
                <button class="pdf-btn" onclick="downloadPDF()">📥 Save as PDF</button>
            </div>
            <p style="color: #666; font-size: 13px;">Kisi bhi member ke 3D gradient box par click karke uski photo aur details dekhein:</p>
            
            <div id="pdfContent" style="background: #fff; padding: 20px; border-radius: 10px;">
                <h3 style="text-align: center; color: #1e3c72; display:none;" id="pdfTitle">Family Tree Report</h3>
                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="chart_div"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2>Naye Member ki Entry Karein</h2>
            <form id="entryForm">
                <div class="form-group"><label>Father I'd:</label><input type="text" id="fatherId" placeholder="Jaise: Root01"></div>
                <div class="form-group"><label>Member I'd:*</label><input type="text" id="memberId" placeholder="Jaise: PATH11" required></div>
                <div class="form-group"><label>Name:*</label><input type="text" id="name" placeholder="Member ka naam" required></div>
                <div class="form-group"><label>Gender:</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group"><label>D.O.B:</label><input type="date" id="dob"></div>
                <div class="form-group"><label>Alive / Death:</label><select id="aliveDeath"><option value="Alive">Alive</option><option value="Death">Death</option></select></div>
                <div class="form-group"><label>Death Anniversary:</label><input type="date" id="deathAnniversary"></div>
                <div class="form-group"><label>Spouse Name:</label><input type="text" id="spouseName" placeholder="Pati/Patni ka naam"></div>
                <div class="form-group"><label>Spouse D.O.B:</label><input type="date" id="spouseDob"></div>
                <div class="form-group"><label>Mobile Number:</label><input type="tel" id="mobile" placeholder="Mobile Number dalein"></div>
                <div class="form-group"><label>Member Photo (Camera / Gallery):</label><input type="file" id="photoFile" accept="image/*"></div>
                <button type="submit" class="submit-btn">Submit & Save to Sheet</button>
            </form>

            <div class="contact-note">
                ⚠️ <b>विशेष सूचना:</b> एंट्री किए गए डेटा में किसी भी तरह का बदलाव या सुधार (Correction/Update) करवाने के लिए संपर्क करें - <br>
                <b>Purushottam Tiwari</b> | 📞 <a href="tel:9752266047">9752266047</a>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const scriptURL = https://script.google.com/macros/s/AKfycbxSaAJ8pIrZz9nta8AG0sROBHXfVD1IIDDQgN3iaK3yM4evHWfnhvjhEr7QuBxvfK6DdQ/exec;
        let globalData = [];

        function openTab(event, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].style.display = "none"; }
            tablinks = document.getElementsByClassName("navbar")[0].getElementsByTagName("button");
            for (i = 0; i < tablinks.length; i++) { tablinks[i].className = tablinks[i].className.replace(" active", ""); }
            document.getElementById(tabName).style.display = "block";
            event.currentTarget.className += " active";
        }
        document.getElementById("defaultOpen").click();

        google.charts.load('current', {packages:["orgchart"]});
        google.charts.setOnLoadCallback(fetchDataAndDrawChart);

        function fetchDataAndDrawChart() {
            fetch(scriptURL)
              .then(response => response.json())
              .then(jsonData => {
                  globalData = jsonData;
                  drawChart(jsonData);
              })
              .catch(error => console.error('Error fetching data:', error));
        }

        function formatDate(dateString) {
            if (!dateString || dateString.trim() === '' || dateString === '-') return '-';
            try {
                let cleanStr = dateString.toString().split('T')[0];
                let parts = cleanStr.split('-');
                if (parts.length === 3) {
                    return parts[2] + '-' + parts[1] + '-' + parts[0];
                }
                return cleanStr;
            } catch (e) {
                return dateString;
            }
        }

        function drawChart(rowsData) {
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Member');
            data.addColumn('string', 'Father');
            data.addColumn('string', 'ToolTip');

            var rows = [];
            rowsData.forEach(function(row) {
                var memberId = row.memberId ? row.memberId.toString().trim() : '';
                var fatherId = row.fatherId ? row.fatherId.toString().trim() : '';
                var name = row.name ? row.name.toString().trim() : 'Unknown';
                var gender = row.gender ? row.gender.toString().trim() : 'Male';
                
                var photoURL = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                if (row.photo && row.photo.trim() !== '' && row.photo !== 'undefined' && row.photo !== 'null') {
                    photoURL = row.photo;
                }

                if(memberId) {
                    // Check if gender is Female to apply light pink class style
                    var nodeClass = (gender.toLowerCase() === 'female') ? 'google-visualization-orgchart-node female-node' : 'google-visualization-orgchart-node';

                    var shortView = '<div class="' + nodeClass + '" style="font-family: Arial; font-size: 12px; padding: 6px; text-align:center;">' +
                                    '<img src="' + photoURL + '" style="width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid #ffffff; box-shadow: 0 3px 6px rgba(0,0,0,0.3); margin-bottom:4px;" onerror="this.src=\'https://cdn-icons-png.flaticon.com/512/149/149071.png\'"><br>' +
                                    '<b style="color: #ffffff; font-size:13px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">' + name + '</b><br><span style="font-size:10px; color:#ffeaa7; font-weight:bold;">ID: ' + memberId + '</span></div>';
                    
                    rows.push([{v: memberId, f: shortView}, fatherId, name]);
                }
            });

            if(rows.length === 0) {
                rows.push([{v:'Root01', f: '<b>Jagdish Chandra Tiwari</b>'}, '', 'Root']);
            }

            data.addRows(rows);

            var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
            
            google.visualization.events.addListener(chart, 'select', function() {
                var selection = chart.getSelection();
                if (selection.length > 0) {
                    var rowIdx = selection[0].row;
                    var selectedMemberId = data.getValue(rowIdx, 0);
                    
                    let memberInfo = globalData.find(m => m.memberId.toString().trim() === selectedMemberId.toString().trim());
                    if(memberInfo) { showPopup(memberInfo); }
                }
            });

            chart.draw(data, {allowHtml:true});
            
            setTimeout(() => {
                const wrapper = document.getElementById('scrollWrapper');
                if(wrapper) {
                    wrapper.scrollLeft = (wrapper.scrollWidth - wrapper.clientWidth) / 2;
                }
            }, 400);
        }

        function showPopup(info) {
            var modal = document.getElementById('detailsModal');
            var content = document.getElementById('modalContent');
            
            var photoURL = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            if (info.photo && info.photo.trim() !== '' && info.photo !== 'undefined' && info.photo !== 'null') {
                photoURL = info.photo;
            }
            
            let dobFormatted = formatDate(info.dob);
            let deathAnnivFormatted = formatDate(info.deathAnniversary);
            let spouseDobFormatted = formatDate(info.spouseDob);

            content.innerHTML = `
                <div style="text-align:center; margin-bottom:12px;">
                    <img src="${photoURL}" style="width:85px; height:85px; border-radius:50%; object-fit:cover; border:3px solid #11998e; box-shadow: 0 5px 15px rgba(0,0,0,0.2);" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
                </div>
                <h3 style="margin-top:0; color:#1e3c72; border-bottom:2px solid #11998e; padding-bottom:8px;">${info.name || 'N/A'}</h3>
                <p style="margin:6px 0; text-align:left;"><b>Member I'd:</b> ${info.memberId}</p>
                <p style="margin:6px 0; text-align:left;"><b>Father I'd:</b> ${info.fatherId || 'None'}</p>
                <p style="margin:6px 0; text-align:left;"><b>Gender:</b> ${info.gender || 'Male'}</p>
                <p style="margin:6px 0; text-align:left;"><b>D.O.B:</b> ${dobFormatted}</p>
                <p style="margin:6px 0; text-align:left;"><b>Status:</b> <span style="color:${info.aliveDeath === 'Death' ? 'red':'green'}; font-weight:bold;">${info.aliveDeath || 'Alive'}</span></p>
                ${info.deathAnniversary && info.deathAnniversary.trim() !== '' ? `<p style="margin:6px 0; text-align:left;"><b>Death Anniv:</b> ${deathAnnivFormatted}</p>` : ''}
                <hr style="margin: 12px 0; border:0; border-top:1px solid #ddd;">
                <p style="margin:6px 0; text-align:left;"><b>Spouse Name:</b> ${info.spouseName || '-'}</p>
                <p style="margin:6px 0; text-align:left;"><b>Spouse D.O.B:</b> ${spouseDobFormatted}</p>
                <p style="margin:6px 0; text-align:left;"><b>Mobile Number:</b> ${info.mobile || '-'}</p>
            `;
            modal.style.display = "block";
        }

        function closeModal() { document.getElementById('detailsModal').style.display = "none"; }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            document.getElementById('pdfTitle').style.display = 'block';
            var opt = {
                margin: 0.5,
                filename: 'Family_Tree_Pyramid.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().from(element).set(opt).save().then(() => {
                document.getElementById('pdfTitle').style.display = 'none';
            });
        }

        const form = document.getElementById('entryForm');
        form.addEventListener('submit', e => {
            e.preventDefault();
            const fileInput = document.getElementById('photoFile');
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) { sendDataToSheet(event.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                sendDataToSheet('');
            }
        });

        function sendDataToSheet(photoBase64) {
            const formData = {
                fatherId: document.getElementById('fatherId').value,
                memberId: document.getElementById('memberId').value,
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                spouseName: document.getElementById('spouseName').value,
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: 'Alive',
                spouseDeathAnniv: '',
                mobile: document.getElementById('mobile').value,
                photo: photoBase64
            };

            fetch(scriptURL, {
                method: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert('Data aur Photo safaltapoorvak Google Sheet mein save ho gaye!');
                form.reset();
                setTimeout(() => { location.reload(); }, 1500);
            })
            .catch(err => alert('Error: ' + err));
        }
    </script>
</body>
</html>
