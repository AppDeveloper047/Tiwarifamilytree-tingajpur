<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Organic Natural Family Tree</title>
    <!-- Google Charts -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Cropper.js CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); color: #333; min-height: 100vh; }
        
        .navbar { background: linear-gradient(90deg, #2e7d32 0%, #1b5e20 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; letter-spacing: 0.5px; }
        .navbar button:hover { background-color: rgba(255,255,255,0.15); }
        .navbar button.active { background-color: #ffb300; color: #1b5e20; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }

        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: auto; }
        .tab-content.active { display: block; }

        .form-card { background: #fff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2e7d32; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #2e7d32; border-bottom: 2px solid #ffb300; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; transition: 0.3s; }
        input:focus, select:focus { border-color: #2e7d32; outline: none; box-shadow: 0 0 8px rgba(46,125,50,0.2); }
        .submit-btn { background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(46,125,50,0.3); }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .contact-note { background: #fff3cd; border-left: 5px solid #ffb300; padding: 15px; border-radius: 8px; margin-top: 25px; font-size: 14px; color: #856404; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .contact-note a { color: #d35400; font-weight: bold; text-decoration: none; }
        .contact-note a:hover { text-decoration: underline; }

        .tree-container { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #ffb300; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .pdf-btn { background: linear-gradient(135deg, #d32f2f 0%, #f44336 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(211,47,47,0.3); transition: 0.3s; }
        .pdf-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* --- ORGANIC GRAPH CONTAINER --- */
        .chart-scroll-wrapper { 
            width: 100%; 
            overflow: auto; 
            display: block; 
            padding: 20px; 
            min-height: 600px; 
            background: radial-gradient(circle, #f1f8e9 0%, #dcedc8 100%); 
            border-radius: 12px; 
            border: 2px dashed #81c784; 
        }

        #organic_tree_canvas {
            position: relative;
            width: 1400px;
            height: 900px;
            margin: auto;
        }

        #branch_svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .organic-node {
            position: absolute;
            cursor: pointer;
            color: #263238;
            background: linear-gradient(135deg, #ffffff 0%, #f1f8e9 100%);
            border: 3px solid #558b2f;
            border-radius: 40px;
            padding: 8px 14px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(85, 139, 47, 0.3);
            z-index: 2;
            transform: translate(-50%, -50%);
            min-width: 120px;
        }

        .organic-node:hover {
            transform: translate(-50%, -50%) scale(1.08);
            background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
            border-color: #f57f17;
            z-index: 10;
        }

        .gen-0-node { background: linear-gradient(135deg, #ffe082 0%, #ffb300 100%); border-color: #e65100; color: #fff; }
        .gen-0-node b { color: #fff; }
        .gen-1-node { background: linear-gradient(135deg, #dcedc8 0%, #aed581 100%); border-color: #33691e; }
        .gen-2-node { background: linear-gradient(135deg, #b2dfdb 0%, #80cbc4 100%); border-color: #004d40; }
        .gen-3-node { background: linear-gradient(135deg, #c5cae9 0%, #9fa8da 100%); border-color: #1a237e; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: linear-gradient(135deg, #fff 0%, #f9fbfd 100%); margin: 5% auto; padding: 25px; border-radius: 15px; width: 360px; max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.3); position: relative; text-align: center; border-top: 5px solid #2e7d32; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 18px; top: 12px; transition: 0.2s; }
        .close-btn:hover { color: #d32f2f; }
        
        .edit-profile-btn {
            background: linear-gradient(135deg, #ff8f00 0%, #e65100 100%);
            color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 10px; box-shadow: 0 3px 8px rgba(230,81,0,0.4);
        }

        #cropperModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .cropper-container-box { background: #fff; width: 90%; max-width: 400px; margin: 10% auto; padding: 20px; border-radius: 12px; text-align: center; }
        .img-container { max-height: 300px; margin-bottom: 15px; }
        .img-container img { max-width: 100%; display: block; }
        .crop-action-btn { background: #2e7d32; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>

<body>

    <input type="file" id="popupPhotoFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'popup')">

    <div id="cropperModal">
        <div class="cropper-container-box">
            <h3 style="margin-top:0; color:#2e7d32;">फोटो क्रॉप करें (Adjust Face)</h3>
            <div class="img-container">
                <img id="imageToCrop" src="">
            </div>
            <button class="crop-action-btn" onclick="getCroppedImage()">Crop & Save</button>
        </div>
    </div>

    <div class="navbar">
        <button id="defaultOpen" onclick="openTab(event, 'treePage')">🌳 Organic Curved Branches</button>
        <button onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content">
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#2e7d32; font-size:20px;">🌿 प्राकृतिक घुमावदार टहनियों वाला वंश वृक्ष</h2>
                <button class="pdf-btn" onclick="downloadPDF()">📥 Save as PDF</button>
            </div>
            
            <div id="pdfContent" style="background: #f1f8e9; padding: 15px; border-radius: 10px;">
                <h3 style="text-align: center; color: #2e7d32; display:none;" id="pdfTitle">Natural Organic Family Tree Report</h3>

                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="organic_tree_canvas">
                        <svg id="branch_svg"></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2>Naye Member ki Entry Karein</h2>

            <form id="entryForm">
                <div class="form-group">
                    <label>Father / Parent (पिता का पूरा नाम चुनें):*</label>
                    <select id="fatherId" required>
                        <option value="">-- Member List Load ho rahi hai --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Member Name (सदस्य का पूरा नाम):*</label>
                    <input type="text" id="name" placeholder="Member ka naam likhein" required>
                </div>
            
                <div class="form-group">
                    <label>Child Level (संतान क्रम):</label>
                    <input type="number" id="childOrder" placeholder="Jaise: 1, 2, 3..." min="1">
                </div>

                <div class="form-group">
                    <label>Gender (लिंग):</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>D.O.B (जन्म दिनांक):</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group">
                    <label>Alive / Death (जीवित / स्वर्गवासी):</label>
                    <select id="aliveDeath">
                        <option value="Alive">Alive</option>
                        <option value="Death">Death</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Death Anniversary (पुण्यतिथि):</label>
                    <input type="date" id="deathAnniversary">
                </div>
            
                <div class="form-group">
                    <label>Marital Status (विवाह की स्थिति):*</label>
                    <select id="maritalStatus" onchange="toggleSpouseFields()">
                        <option value="Married">Married</option>
                        <option value="Unmarried">Unmarried</option>
                    </select>
                </div>

                <div id="spouseFieldsContainer">
                    <div class="form-group">
                        <label>Spouse Name (पति/पत्नी का नाम):</label>
                        <input type="text" id="spouseName" placeholder="Pati/Patni ka naam">
                    </div>
                    <div class="form-group">
                        <label>Spouse D.O.B:</label>
                        <input type="date" id="spouseDob">
                    </div>
                    <div class="form-group">
                        <label>Spouse Alive / Death:</label>
                        <select id="spouseAliveDeath">
                            <option value="Alive">Alive</option>
                            <option value="Death">Death</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Spouse Death Anniversary:</label>
                        <input type="date" id="spouseDeathAnniv">
                    </div>
                </div>
            
                <div class="form-group">
                    <label>Mobile Number (मोबाइल नंबर):</label>
                    <input type="tel" id="mobile" placeholder="Mobile Number dalein">
                </div>

                <div class="form-group">
                    <label>Member Photo ( HD फोटो ):</label>
                    <input type="file" id="photoFile" accept="image/*" onchange="handleFileSelect(this, 'entry')">
                </div>

                <button type="submit" class="submit-btn">Submit & Save to Sheet</button>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxSaAJ8pIrZz9nta8AG0sROBHXfVD1IIDDQgN3iaK3yM4evHWfnhvjhEr7QuBxvfK6DdQ/exec';
        let globalData = [];
        let currentEditingMemberId = '';
        let cropper = null;
        let activeUploadType = ''; 
        let finalProcessedPhoto = '';

        function handleFileSelect(input, type) {
            activeUploadType = type;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageElement = document.getElementById('imageToCrop');
                    imageElement.src = e.target.result;
                    document.getElementById('cropperModal').style.display = 'block';

                    if (cropper) { cropper.destroy(); }
                    cropper = new Cropper(imageElement, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.9 });
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCroppedImage() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
            finalProcessedPhoto = canvas.toDataURL('image/jpeg', 0.9);

            document.getElementById('cropperModal').style.display = 'none';
            cropper.destroy();
            cropper = null;

            if (activeUploadType === 'popup') {
                let member = globalData.find(m => {
                    let mName = m.name ? m.name.toString().trim() : (m.memberId ? m.memberId.toString().trim() : '');
                    return mName === currentEditingMemberId;
                });
                if (member) {
                    member.photo = finalProcessedPhoto;
                    showPopup(member);
                    renderOrganicTree(globalData);
                    updatePhotoInSheet(currentEditingMemberId, finalProcessedPhoto);
                }
            } else {
                alert("फोटो सफलतापूर्वक क्रॉप हो चुकी है!");
            }
        }

        function toggleSpouseFields() {
            var status = document.getElementById('maritalStatus').value;
            var container = document.getElementById('spouseFieldsContainer');
            container.style.display = (status === 'Unmarried') ? 'none' : 'block';
        }

        function openTab(event, tabName) {
            var tabcontent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
            
            var tablinks = document.getElementsByClassName("navbar")[0].getElementsByTagName("button");
            for (let i = 0; i < tablinks.length; i++) tablinks[i].className = tablinks[i].className.replace(" active", "");
            
            document.getElementById(tabName).style.display = "block";
            event.currentTarget.className += " active";
        }

        document.getElementById("defaultOpen").click();

        window.addEventListener('DOMContentLoaded', () => {
            fetchDataAndBuildTree();
        });

        function fetchDataAndBuildTree() {
            fetch(scriptURL)
            .then(response => response.json())
            .then(jsonData => {
                globalData = jsonData.map((row) => {
                    return {
                        fatherId: row.fatherId !== undefined ? row.fatherId : (row[0] || ''),
                        memberId: row.memberId !== undefined ? row.memberId : (row[1] || ''),
                        name: row.name !== undefined ? row.name : (row[2] || ''),
                        dob: row.dob !== undefined ? row.dob : (row[3] || ''),
                        aliveDeath: row.aliveDeath !== undefined ? row.aliveDeath : (row[4] || 'Alive'),
                        deathAnniversary: row.deathAnniversary !== undefined ? row.deathAnniversary : (row[5] || ''),
                        maritalStatus: row.maritalStatus !== undefined ? row.maritalStatus : (row[6] || 'Married'),
                        spouseName: row.spouseName !== undefined ? row.spouseName : (row[7] || ''),
                        spouseDob: row.spouseDob !== undefined ? row.spouseDob : (row[8] || ''),
                        spouseAliveDeath: row.spouseAliveDeath !== undefined ? row.spouseAliveDeath : (row[9] || 'Alive'),
                        spouseDeathAnniv: row.spouseDeathAnniv !== undefined ? row.spouseDeathAnniv : (row[10] || ''),
                        gender: row.gender !== undefined ? row.gender : (row[11] || 'Male'),
                        mobile: row.mobile !== undefined ? row.mobile : (row[12] || ''),
                        childOrder: row.childOrder !== undefined ? row.childOrder : (row[13] || ''),
                        photo: row.photo !== undefined ? row.photo : (row[14] || '')
                    };
                });
                
                populateFatherDropdown(globalData);
                renderOrganicTree(globalData);
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
        }

        function populateFatherDropdown(dataRows) {
            const fatherSelect = document.getElementById('fatherId');
            fatherSelect.innerHTML = '<option value="">-- Pita / Mukhiya ka naam chunein --</option>';
            dataRows.forEach(row => {
                let mName = row.name ? row.name.toString().trim() : '';
                if (mName) {
                    let option = document.createElement('option');
                    option.value = mName; 
                    option.textContent = mName; 
                    fatherSelect.appendChild(option);
                }
            });
        }

        function formatDate(dateString) {
            if (!dateString || dateString.trim() === '' || dateString === '-') return '-';
            try {
                let cleanStr = dateString.toString().split('T')[0];
                let parts = cleanStr.split('-');
                return (parts.length === 3) ? `${parts[2]}-${parts[1]}-${parts[0]}` : cleanStr;
            } catch (e) { return dateString; }
        }

        // --- FIXED ORGANIC GRAPH RENDERING ENGINE ---
        function renderOrganicTree(rowsData) {
            const canvas = document.getElementById('organic_tree_canvas');
            const svg = document.getElementById('branch_svg');
            
            canvas.querySelectorAll('.organic-node').forEach(n => n.remove());
            svg.innerHTML = '';

            if (!rowsData || rowsData.length === 0) return;

            let nodeMap = {};
            let childrenMap = {};
            let allNames = new Set();

            rowsData.forEach(row => {
                let name = (row.name || row.memberId || '').toString().trim();
                if (name) {
                    allNames.add(name);
                    nodeMap[name] = row;
                }
            });

            rowsData.forEach(row => {
                let name = (row.name || row.memberId || '').toString().trim();
                let father = (row.fatherId || '').toString().trim();
                if (name) {
                    if (!childrenMap[father]) childrenMap[father] = [];
                    childrenMap[father].push(name);
                }
            });

            let roots = rowsData.filter(r => {
                let f = (r.fatherId || '').toString().trim();
                return !f || !allNames.has(f);
            }).map(r => (r.name || r.memberId || '').toString().trim());

            if (roots.length === 0 && rowsData.length > 0) {
                roots = [(rowsData[0].name || rowsData[0].memberId).toString().trim()];
            }

            let levels = {};
            let queue = roots.map(r => ({name: r, gen: 0}));
            roots.forEach(r => levels[r] = 0);

            let genRows = {};
            while(queue.length > 0) {
                let item = queue.shift();
                let g = item.gen;
                if(!genRows[g]) genRows[g] = [];
                genRows[g].push(item.name);

                let kids = childrenMap[item.name] || [];
                kids.forEach(k => {
                    if (levels[k] === undefined) {
                        levels[k] = g + 1;
                        queue.push({name: k, gen: g + 1});
                    }
                });
            }

            let coords = {};
            let maxGen = Math.max(...Object.keys(genRows).map(Number));
            let canvasHeight = Math.max(800, (maxGen + 1) * 160 + 100);
            let canvasWidth = 1400;
            
            canvas.style.height = canvasHeight + 'px';
            svg.setAttribute("height", canvasHeight);
            svg.setAttribute("width", canvasWidth);

            Object.keys(genRows).forEach(g => {
                let membersInGen = genRows[g];
                let count = membersInGen.length;
                let y = 80 + parseInt(g) * 150;
                let spacing = canvasWidth / (count + 1);

                membersInGen.forEach((mName, idx) => {
                    let x = spacing * (idx + 1);
                    coords[mName] = {x: x, y: y};
                });
            });

            // Draw Curved Bezier Branches
            rowsData.forEach(row => {
                let name = (row.name || row.memberId || '').toString().trim();
                let father = (row.fatherId || '').toString().trim();

                if (name && coords[name] && father && coords[father]) {
                    let p1 = coords[father];
                    let p2 = coords[name];

                    let cx1 = p1.x;
                    let cy1 = p1.y + (p2.y - p1.y) / 2;
                    let cx2 = p2.x;
                    let cy2 = p1.y + (p2.y - p1.y) / 2;

                    let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    let dStr = `M ${p1.x} ${p1.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${p2.x} ${p2.y}`;
                    path.setAttribute("d", dStr);
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke", "#5d4037");
                    path.setAttribute("stroke-width", "4");
                    path.setAttribute("stroke-linecap", "round");
                    svg.appendChild(path);
                }
            });

            // Render Nodes
            rowsData.forEach(row => {
                let name = (row.name || row.memberId || '').toString().trim();
                if (name && coords[name]) {
                    let pos = coords[name];
                    let genLevel = levels[name] !== undefined ? levels[name] : 1;
                    let genClass = genLevel === 0 ? 'gen-0-node' : (genLevel === 1 ? 'gen-1-node' : (genLevel === 2 ? 'gen-2-node' : 'gen-3-node'));

                    let photoURL = row.photo && row.photo.trim() !== '' ? row.photo : 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                    let orderNum = row.childOrder ? `<span style="background:#558b2f; padding:1px 5px; border-radius:8px; font-size:8px; color:#fff; font-weight:bold; display:inline-block; margin-bottom:2px;">Branch ${row.childOrder}</span><br>` : '';

                    let nodeDiv = document.createElement('div');
                    nodeDiv.className = `organic-node ${genClass}`;
                    nodeDiv.style.left = pos.x + 'px';
                    nodeDiv.style.top = pos.y + 'px';
                    nodeDiv.innerHTML = `
                        <img src="${photoURL}" style="width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid #fff; margin-bottom:3px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'"><br>
                        ${orderNum}
                        <b style="font-size:11px; display:block;">🌿 ${name}</b>
                    `;

                    nodeDiv.onclick = () => showPopup(row);
                    canvas.appendChild(nodeDiv);
                }
            });
        }

        function showPopup(info) {
            var modal = document.getElementById('detailsModal');
            var content = document.getElementById('modalContent');
            var photoURL = info.photo && info.photo.trim() !== '' ? info.photo : 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

            let memberDisplayName = info.name || info.memberId || 'N/A';
            currentEditingMemberId = memberDisplayName;

            content.innerHTML = `
                <div style="text-align:center; margin-bottom:10px;">
                    <img src="${photoURL}" style="width:75px; height:75px; border-radius:50%; object-fit:cover; border:3px solid #2e7d32;"><br>
                    <button class="edit-profile-btn" onclick="document.getElementById('popupPhotoFile').click()">✏️ Edit Photo</button>
                </div>
                <h3 style="margin-top:0; color:#2e7d32; border-bottom:2px solid #2e7d32; padding-bottom:5px;">${memberDisplayName}</h3>
                <p style="margin:4px 0; text-align:left;"><b>Father Name:</b> ${info.fatherId || '-'}</p>
                <p style="margin:4px 0; text-align:left;"><b>Gender:</b> ${info.gender || 'Male'}</p>
                <p style="margin:4px 0; text-align:left;"><b>Status:</b> ${info.aliveDeath || 'Alive'}</p>
                <p style="margin:4px 0; text-align:left;"><b>Mobile:</b> ${info.mobile || '-'}</p>
            `;
            modal.style.display = "block";
        }

        function closeModal() { document.getElementById('detailsModal').style.display = "none"; }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            document.getElementById('pdfTitle').style.display = 'block';
            html2pdf().from(element).set({ margin: 0.5, filename: 'Family_Tree.pdf', html2canvas: { scale: 2, useCORS: true } }).save().then(() => {
                document.getElementById('pdfTitle').style.display = 'none';
            });
        }

        document.getElementById('entryForm').addEventListener('submit', e => {
            e.preventDefault();
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.innerText = 'Saving...';
            submitBtn.disabled = true;

            const formData = {
                fatherId: document.getElementById('fatherId').value,
                memberId: document.getElementById('name').value.trim(),
                name: document.getElementById('name').value.trim(),
                childOrder: document.getElementById('childOrder').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                spouseName: document.getElementById('spouseName').value,
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveDeath').value,
                spouseDeathAnniv: document.getElementById('spouseDeathAnniv').value,
                mobile: document.getElementById('mobile').value,
                photo: finalProcessedPhoto || ''
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
            .then(() => {
                alert('Data successfully saved!');
                location.reload();
            })
            .catch(() => {
                alert('Data successfully saved!');
                location.reload();
            });
        });
    </script>
</body>
</html>
