<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Application</title>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Cropper.js CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; color: #333; }
        
        .navbar { background-color: #2c3e50; overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 14px 28px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; }
        .navbar button:hover { background-color: #34495e; }
        .navbar button.active { background-color: #3498db; }

        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: auto; }
        .tab-content.active { display: block; }

        .form-card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 700px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        .submit-btn { background-color: #27ae60; color: white; padding: 12px; border: none; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .submit-btn:hover { background-color: #219653; }

        .contact-note { background: #fff8e1; border-left: 4px solid #ffc107; padding: 12px; border-radius: 6px; margin-top: 20px; font-size: 14px; color: #856404; text-align: center; }
        .contact-note a { color: #e67e22; font-weight: bold; text-decoration: none; }

        .tree-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .pdf-btn { background-color: #e74c3c; color: white; padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .pdf-btn:hover { background-color: #c0392b; }

        /* Zoom Controls Style */
        .zoom-controls { display: flex; gap: 5px; align-items: center; }
        .zoom-btn { background: #34495e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .zoom-btn:hover { background: #2c3e50; }

        /* --- CLASSIC ORIGINAL TREE LAYOUT --- */
        .chart-scroll-wrapper { 
            width: 100%; 
            overflow: auto; 
            display: block; 
            padding: 20px; 
            min-height: 650px; 
            background: #fafbfc; 
            border-radius: 8px; 
            border: 1px solid #e1e4e8; 
            position: relative;
        }

        #tree-canvas-area {
            position: relative;
            width: 4500px;
            height: 2200px;
            margin: 0 auto;
            transform: scale(0.45); /* शुरुआती ओवरव्यू ताकि पूरा ट्री एक साथ साफ़ दिखे */
            transform-origin: top center;
            transition: transform 0.2s ease;
        }

        /* SVG Straight/Angular Connectors */
        #branch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* --- CLASSIC NODE BOX DESIGN --- */
        .node-card {
            position: absolute;
            cursor: pointer;
            color: #333;
            background: #ffffff;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 8px 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            z-index: 2;
            text-align: center;
            width: 160px;
            box-sizing: border-box;
        }

        .node-card:hover {
            transform: translateY(-3px);
            border-color: #2980b9;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            z-index: 10;
        }

        /* Generation Box Colors */
        .gen-0-node { background: #eaf2f8; border-color: #2980b9; }
        .gen-1-node { background: #e8f8f5; border-color: #1abc9c; }
        .gen-2-node { background: #fef9e7; border-color: #f1c40f; }
        .gen-3-node { background: #f4ecf7; border-color: #8e44ad; }

        /* --- POPUP MODAL DESIGN --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background: #ffffff; margin: 6% auto; padding: 25px; border-radius: 8px; width: 320px; max-height: 85vh; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; text-align: left; }
        .close-btn { color: #aaa; float: right; font-size: 24px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; }
        .close-btn:hover { color: #000; }
        
        .edit-profile-btn {
            background-color: #f39c12; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin: 8px auto 10px auto; display: block;
        }
        .edit-profile-btn:hover { background-color: #d68910; }

        #cropperModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .cropper-container-box { background: #fff; width: 90%; max-width: 400px; margin: 10% auto; padding: 20px; border-radius: 8px; text-align: center; }
        .img-container { max-height: 300px; margin-bottom: 15px; }
        .img-container img { max-width: 100%; display: block; }
        .crop-action-btn { background: #27ae60; color: white; border: none; padding: 8px 16px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>

<body>

    <input type="file" id="popupPhotoFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'popup')">

    <div id="cropperModal">
        <div class="cropper-container-box">
            <h3 style="margin-top:0;">फोटो क्रॉप करें (Adjust Face)</h3>
            <div class="img-container">
                <img id="imageToCrop" src="">
            </div>
            <button class="crop-action-btn" onclick="getCroppedImage()">Crop & Save</button>
        </div>
    </div>

    <div class="navbar">
        <button id="defaultOpen" onclick="openTab(event, 'treePage')">🌳 Family Tree Chart</button>
        <button onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content">
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#2c3e50; font-size:20px;">🌿 पारिवारिक वृक्ष (Family Tree)</h2>
                
                <!-- Zoom Controls & PDF Button -->
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomTree(0.15)">➕ ज़ूम+</button>
                        <button class="zoom-btn" onclick="zoomTree(-0.15)">➖ ज़ूम-</button>
                        <button class="zoom-btn" onclick="resetZoom()">↺ रीसेट</button>
                    </div>
                    <button class="pdf-btn" onclick="downloadPDF()">📥 Save PDF</button>
                </div>
            </div>

            <p style="color: #666; font-size: 12px; margin-bottom: 10px;">
                किसी भी सदस्य के बॉक्स पर क्लिक करके पूरी जानकारी देखें:
            </p>
            
            <div id="pdfContent" style="background: #fafbfc; padding: 10px; border-radius: 6px;">
                <h3 style="text-align: center; color: #2c3e50; display:none;" id="pdfTitle">Family Tree Report</h3>

                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="tree-canvas-area">
                        <svg id="branch-svg"></svg>
                        <div id="nodes-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2>Naye Member ki Entry Karein</h2>

            <form id="entryForm">
                <div class="form-group">
                    <label>Father / Parent (पिता का पूरा नाम चुनें):*</label>
                    <select id="fatherId" required>
                        <option value="">-- Member List Load ho rahi hai --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Member Name (सदस्य का पूरा नाम):*</label>
                    <input type="text" id="name" placeholder="Member ka naam likhein" required>
                </div>
            
                <div class="form-group">
                    <label>Child Level (संतान क्रम):</label>
                    <input type="number" id="childOrder" placeholder="Jaise: 1, 2, 3..." min="1">
                </div>

                <div class="form-group">
                    <label>Gender (लिंग):</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>D.O.B (जन्म दिनांक):</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group">
                    <label>Alive / Death (जीवित / स्वर्गवासी):</label>
                    <select id="aliveDeath">
                        <option value="Alive">Alive</option>
                        <option value="Death">Death</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Death Anniversary (पुण्यतिथि):</label>
                    <input type="date" id="deathAnniversary">
                </div>
            
                <div class="form-group">
                    <label>Marital Status (विवाह की स्थिति):*</label>
                    <select id="maritalStatus" onchange="toggleSpouseFields()">
                        <option value="Married">Married</option>
                        <option value="Unmarried">Unmarried</option>
                    </select>
                </div>

                <div id="spouseFieldsContainer">
                    <div class="form-group">
                        <label>Spouse Name (पति/पत्नी का नाम):</label>
                        <input type="text" id="spouseName" placeholder="Pati/Patni ka naam">
                    </div>
                    <div class="form-group">
                        <label>Spouse D.O.B:</label>
                        <input type="date" id="spouseDob">
                    </div>
                    <div class="form-group">
                        <label>Spouse Alive / Death:</label>
                        <select id="spouseAliveDeath">
                            <option value="Alive">Alive</option>
                            <option value="Death">Death</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Spouse Death Anniversary:</label>
                        <input type="date" id="spouseDeathAnniv">
                    </div>
                </div>
            
                <div class="form-group">
                    <label>Mobile Number (मोबाइल नंबर):</label>
                    <input type="tel" id="mobile" placeholder="Mobile Number dalein">
                </div>

                <div class="form-group">
                    <label>Member Photo ( फोटो ):</label>
                    <input type="file" id="photoFile" accept="image/*" onchange="handleFileSelect(this, 'entry')">
                </div>

                <button type="submit" class="submit-btn">Submit & Save to Sheet</button>
            </form>

            <div class="contact-note">
                ⚠️ <b>विशेष सूचना:</b> किसी भी बदलाव के लिए संपर्क करें - <br>
                <b>Purushottam Tiwari</b> | 📞 <a href="tel:9752266047">9752266047</a>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxSaAJ8pIrZz9nta8AG0sROBHXfVD1IIDDQgN3iaK3yM4evHWfnhvjhEr7QuBxvfK6DdQ/exec';
        let globalData = [];
        let currentEditingMemberId = '';
        let cropper = null;
        let activeUploadType = ''; 
        let finalProcessedPhoto = '';
        let currentScale = 0.45; // Default overview scale

        function zoomTree(amount) {
            currentScale += amount;
            if (currentScale < 0.2) currentScale = 0.2; 
            if (currentScale > 1.2) currentScale = 1.2; 
            document.getElementById('tree-canvas-area').style.transform = `scale(${currentScale})`;
        }

        function resetZoom() {
            currentScale = 0.45;
            document.getElementById('tree-canvas-area').style.transform = `scale(${currentScale})`;
        }

        function handleFileSelect(input, type) {
            activeUploadType = type;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageElement = document.getElementById('imageToCrop');
                    imageElement.src = e.target.result;
                    document.getElementById('cropperModal').style.display = 'block';

                    if (cropper) {
                        cropper.destroy();
                    }
                    cropper = new Cropper(imageElement, {
                        aspectRatio: 1,
                        viewMode: 1,
                        autoCropArea: 0.9
                    });
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCroppedImage() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({
                width: 300,
                height: 300
            });
            finalProcessedPhoto = canvas.toDataURL('image/jpeg', 0.9);

            document.getElementById('cropperModal').style.display = 'none';
            cropper.destroy();
            cropper = null;

            if (activeUploadType === 'popup') {
                let member = globalData.find(m => {
                    let mName = m.name ? m.name.toString().trim() : (m.memberId ? m.memberId.toString().trim() : '');
                    return mName === currentEditingMemberId;
                });
                if (member) {
                    member.photo = finalProcessedPhoto;
                    showPopup(member);
                    renderClassicTree(globalData);
                    updatePhotoInSheet(currentEditingMemberId, finalProcessedPhoto);
                }
            } else {
                alert("फोटो सफलतापूर्वक क्रॉप हो चुकी है! अब आप 'Submit & Save to Sheet' पर क्लिक करें।");
            }
        }

        function toggleSpouseFields() {
            var status = document.getElementById('maritalStatus').value;
            var container = document.getElementById('spouseFieldsContainer');
            if (status === 'Unmarried') {
                container.style.display = 'none';
                document.getElementById('spouseName').value = '';
                document.getElementById('spouseDob').value = '';
                document.getElementById('spouseDeathAnniv').value = '';
            } else {
                container.style.display = 'block';
            }
        }

        function openTab(event, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("navbar")[0].getElementsByTagName("button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            event.currentTarget.className += " active";
        }

        document.getElementById("defaultOpen").click();

        window.addEventListener('DOMContentLoaded', () => {
            fetchDataAndDrawChart();
        });

        function fetchDataAndDrawChart() {
            fetch(scriptURL)
            .then(response => response.json())
            .then(jsonData => {
                globalData = jsonData.map((row) => {
                    return {
                        fatherId: row.fatherId !== undefined ? row.fatherId : (row[0] || ''),
                        memberId: row.memberId !== undefined ? row.memberId : (row[1] || ''),
                        name: row.name !== undefined ? row.name : (row[2] || ''),
                        dob: row.dob !== undefined ? row.dob : (row[3] || ''),
                        aliveDeath: row.aliveDeath !== undefined ? row.aliveDeath : (row[4] || 'Alive'),
                        deathAnniversary: row.deathAnniversary !== undefined ? row.deathAnniversary : (row[5] || ''),
                        maritalStatus: row.maritalStatus !== undefined ? row.maritalStatus : (row[6] || 'Married'),
                        spouseName: row.spouseName !== undefined ? row.spouseName : (row[7] || ''),
                        spouseDob: row.spouseDob !== undefined ? row.spouseDob : (row[8] || ''),
                        spouseAliveDeath: row.spouseAliveDeath !== undefined ? row.spouseAliveDeath : (row[9] || 'Alive'),
                        spouseDeathAnniv: row.spouseDeathAnniv !== undefined ? row.spouseDeathAnniv : (row[10] || ''),
                        mobile: row.mobile !== undefined ? row.mobile : (row[11] || ''),
                        photo: row.photo !== undefined ? row.photo : (row[12] || ''),
                        childOrder: row.childOrder !== undefined ? Number(row.childOrder) : 99,
                        gender: row.gender !== undefined ? row.gender : (row[13] || 'Male')
                    };
                });

                populateFatherDropdown();
                renderClassicTree(globalData);
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('nodes-container').innerHTML = '<div style="color:red; text-align:center; padding:20px;">Data load karne mein samasya aayi hai.</div>';
            });
        }

        function populateFatherDropdown() {
            const select = document.getElementById('fatherId');
            select.innerHTML = '<option value="">-- Root Member / Parent Chunein --</option>';
            
            globalData.forEach(member => {
                let mName = member.name ? member.name.toString().trim() : (member.memberId ? member.memberId.toString().trim() : '');
                if (mName) {
                    let opt = document.createElement('option');
                    opt.value = mName;
                    opt.textContent = mName + (member.spouseName ? ' & ' + member.spouseName : '');
                    select.appendChild(opt);
                }
            });
        }

        // --- CLASSIC ORIGINAL TREE RENDERING ENGINE ---
        function renderClassicTree(dataArray) {
            const container = document.getElementById('nodes-container');
            const svg = document.getElementById('branch-svg');
            container.innerHTML = '';
            svg.innerHTML = '';

            if (!dataArray || dataArray.length === 0) return;

            let map = {};
            dataArray.forEach(m => {
                let name = m.name ? m.name.toString().trim() : (m.memberId ? m.memberId.toString().trim() : '');
                if (name) {
                    if (!map[name]) {
                        map[name] = { ...m, children: [] };
                    } else {
                        map[name] = { ...map[name], ...m, children: map[name].children };
                    }
                }
            });

            let roots = [];
            let nodeMap = {};

            Object.values(map).forEach(node => {
                nodeMap[node.name] = node;
            });

            Object.values(map).forEach(node => {
                let fId = node.fatherId ? node.fatherId.toString().trim() : '';
                if (fId && nodeMap[fId]) {
                    nodeMap[fId].children.push(node);
                } else {
                    roots.push(node);
                }
            });

            Object.values(nodeMap).forEach(node => {
                node.children.sort((a, b) => (a.childOrder || 99) - (b.childOrder || 99));
            });

            let startX = 2250; 
            let startY = 60;
            let levelHeight = 150;

            function measureSubtree(node) {
                if (!node.children || node.children.length === 0) {
                    node.subtreeWidth = 180;
                    return 180;
                }
                let w = 0;
                node.children.forEach(c => {
                    w += measureSubtree(c);
                });
                node.subtreeWidth = Math.max(180, w);
                return node.subtreeWidth;
            }

            roots.forEach(r => measureSubtree(r));

            let nodePositions = {};

            function layoutNode(node, x, y, depth) {
                node.x = x;
                node.y = y;
                nodePositions[node.name] = { x: x + 80, y: y + 35 };

                let currentX = x - (node.subtreeWidth / 2);
                if (node.children && node.children.length > 0) {
                    node.children.forEach(c => {
                        let childW = c.subtreeWidth;
                        layoutNode(c, currentX + (childW / 2), y + levelHeight, depth + 1);
                        currentX += childW;
                    });
                }
            }

            let rootXOffset = startX;
            roots.forEach(r => {
                layoutNode(r, rootXOffset, startY, 0);
                rootXOffset += r.subtreeWidth + 100;
            });

            function renderRecursive(node) {
                let memberName = node.name;
                let defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                let photoSrc = (node.photo && node.photo.length > 10) ? node.photo : defaultAvatar;

                let genLevel = 0;
                let p = nodeMap[node.fatherId];
                let tempDepth = 0;
                while(p) {
                    tempDepth++;
                    p = nodeMap[p.fatherId];
                }
                genLevel = tempDepth;
                let genClass = 'gen-' + (genLevel > 3 ? '3' : genLevel) + '-node';

                let card = document.createElement('div');
                card.className = `node-card ${genClass}`;
                card.style.left = node.x + 'px';
                card.style.top = node.y + 'px';
                card.innerHTML = `
                    <img src="${photoSrc}" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:1px solid #ccc; margin-bottom:2px;" /><br>
                    <b style="font-size:11px; color:#2c3e50;">${memberName}</b>
                    ${node.spouseName ? '<br><span style="font-size:9px; color:#555;">w/o ' + node.spouseName + '</span>' : ''}
                `;
                card.onclick = () => openMemberModal(memberName);
                container.appendChild(card);

                if (node.children && node.children.length > 0) {
                    let parentPos = nodePositions[node.name];

                    node.children.forEach(child => {
                        let childPos = nodePositions[child.name];
                        if (childPos) {
                            let x1 = parentPos.x;
                            let y1 = parentPos.y + 15;
                            let x2 = childPos.x;
                            let y2 = childPos.y - 35;
                            
                            let midY = (y1 + y2) / 2;
                            let pathData = `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;

                            let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                            path.setAttribute("d", pathData);
                            path.setAttribute("stroke", "#95a5a6");
                            path.setAttribute("stroke-width", "2");
                            path.setAttribute("fill", "none");
                            svg.appendChild(path);
                        }
                        renderRecursive(child);
                    });
                }
            }

            roots.forEach(r => renderRecursive(r));

            // Auto-scroll to center on load
            setTimeout(() => {
                const wrapper = document.getElementById('scrollWrapper');
                wrapper.scrollLeft = startX - (wrapper.clientWidth / 2);
            }, 100);
        }

        function openMemberModal(memberName) {
            let member = globalData.find(m => {
                let mName = m.name ? m.name.toString().trim() : (m.memberId ? m.memberId.toString().trim() : '');
                return mName === memberName;
            });
            if (member) {
                currentEditingMemberId = memberName;
                showPopup(member);
            }
        }

        function showPopup(member) {
            let defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
            let photoSrc = (member.photo && member.photo.length > 10) ? member.photo : defaultAvatar;

            let html = `
                <div style="text-align: center;">
                    <img src="${photoSrc}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid #3498db;"/>
                    <button class="edit-profile-btn" onclick="triggerPopupPhotoUpload()">✏️ Edit Photo</button>
                    <h3 style="margin:5px 0 10px 0; color:#2c3e50; border-bottom:1px solid #eee; padding-bottom:5px;">${member.name || 'N/A'}</h3>
                </div>
                <div style="font-size: 13px; line-height: 1.5; color: #444;">
                    <p style="margin: 5px 0;"><b>Child Level:</b> ${member.childOrder || '1'}</p>
                    <p style="margin: 5px 0;"><b>Father Name:</b> ${member.fatherId || 'Root / Top'}</p>
                    <p style="margin: 5px 0;"><b>Gender:</b> ${member.gender || 'Male'}</p>
                    <p style="margin: 5px 0;"><b>Marital Status:</b> ${member.maritalStatus || 'Married'} ${member.spouseName ? '(& w/o ' + member.spouseName + ')' : ''}</p>
                    <p style="margin: 5px 0;"><b>D.O.B:</b> ${member.dob || 'N/A'}</p>
                    <p style="margin: 5px 0;"><b>Status:</b> ${member.aliveDeath || 'Alive'} ${member.deathAnniversary ? '('+member.deathAnniversary+')' : ''}</p>
                    <hr style="border:0; border-top:1px solid #eee; margin: 10px 0;">
                    <p style="margin: 5px 0;"><b>Mobile Number:</b> <a href="tel:${member.mobile}" style="color:#2980b9; font-weight:bold; text-decoration:none;">${member.mobile || 'N/A'}</a></p>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('detailsModal').style.display = 'block';
        }

        function triggerPopupPhotoUpload() {
            document.getElementById('popupPhotoFile').click();
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function updatePhotoInSheet(memberName, base64Photo) {
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'updatePhoto', memberId: memberName, photo: base64Photo })
            })
            .then(() => console.log('Photo updated in sheet'))
            .catch(err => console.error(err));
        }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let formData = {
                fatherId: document.getElementById('fatherId').value,
                name: document.getElementById('name').value.trim(),
                childOrder: document.getElementById('childOrder').value || 99,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                spouseName: document.getElementById('spouseName').value.trim(),
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveDeath').value,
                spouseDeathAnniv: document.getElementById('spouseDeathAnniv').value,
                mobile: document.getElementById('mobile').value.trim(),
                photo: finalProcessedPhoto || ''
            };

            let submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert('Data safaltapurvak save ho gaya hai!');
                document.getElementById('entryForm').reset();
                finalProcessedPhoto = '';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit & Save to Sheet';
                fetchDataAndDrawChart = fetchDataAndDrawChart();
                openTab({currentTarget: document.querySelector('.navbar button:first-child')}, 'treePage');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Data save karne mein error aayi hai.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit & Save to Sheet';
            });
        });

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            document.getElementById('pdfTitle').style.display = 'block';
            
            let opt = {
                margin:       0.5,
                filename:     'Family_Tree_Report.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                document.getElementById('pdfTitle').style.display = 'none';
            });
        }
    </script>
</body>
</html>
