<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree View & Updates</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; }
        .navbar button:hover { background-color: rgba(255,255,255,0.1); }
        .navbar button.active { background-color: #ff9800; color: white; }
        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: auto; }
        .tab-content.active { display: block; }

        /* Top Feature Bar */
        .top-feature-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .feature-dropdown-container { position: relative; display: inline-block; }
        .feature-btn { background: #1e3c72; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.2s; }
        .feature-btn:hover { background: #2a5298; }

        /* Dropdown Content Boxes */
        .dropdown-panel { display: none; position: absolute; background: #fff; min-width: 320px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border-radius: 10px; z-index: 100; left: 0; top: 50px; padding: 15px; border-top: 4px solid #ff9800; }
        .dropdown-panel select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; margin-top: 5px; }

        /* --- PROFESSIONAL RICH BANNER WIDGET --- */
        @keyframes fadeInSlide {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes premiumGlow {
            0% { box-shadow: 0 15px 35px rgba(10, 38, 71, 0.2); }
            50% { box-shadow: 0 20px 45px rgba(24, 119, 242, 0.35); }
            100% { box-shadow: 0 15px 35px rgba(10, 38, 71, 0.2); }
        }

        .event-slider-card { 
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%); 
            border-radius: 20px; 
            padding: 30px; 
            margin-bottom: 30px; 
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); 
            position: relative;
            overflow: hidden;
            animation: premiumGlow 5s infinite;
        }
        
        .event-header-title { 
            font-size: 17px; 
            font-weight: 800; 
            color: #fff; 
            margin-bottom: 22px; 
            background: linear-gradient(135deg, #f72585 0%, #7209b7 100%); 
            padding: 8px 24px; 
            border-radius: 30px; 
            display: inline-block;
            box-shadow: 0 4px 15px rgba(114, 9, 183, 0.4);
            letter-spacing: 0.5px;
        }

        .slider-content-box { 
            display: flex; 
            align-items: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 100%; 
            animation: fadeInSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slider-img-wrapper {
            position: relative;
            padding: 5px;
            background: linear-gradient(135deg, #ff9e00 0%, #ff0054 50%, #9b5de5 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .slider-img { 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #fff; 
            display: block;
        }

        .slider-details { 
            text-align: left; 
            max-width: 540px; 
            font-size: 15px; 
            line-height: 1.8; 
            background: rgba(255, 255, 255, 0.95);
            padding: 22px 28px;
            border-radius: 16px;
            border-left: 6px solid #4361ee;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            flex: 1;
            min-width: 290px;
        }

        .edit-profile-btn { 
            background: linear-gradient(135deg, #f77f00 0%, #fcbf49 100%); 
            color: #432818; 
            border: none; 
            padding: 9px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            margin-top: 12px; 
            box-shadow: 0 4px 12px rgba(247, 127, 0, 0.4);
            transition: 0.2s;
        }
        .edit-profile-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(247, 127, 0, 0.6); }

        /* Comment Box Section Inside Widget */
        .comment-section { background: rgba(255, 255, 255, 0.95); border-radius: 14px; padding: 18px; margin-top: 25px; width: 100%; box-sizing: border-box; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .comment-section textarea { width: 100%; height: 75px; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; resize: none; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .comment-submit-btn { background: linear-gradient(135deg, #2b9348 0%, #55a630 100%); color: white; border: none; padding: 10px 22px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; float: right; box-shadow: 0 4px 12px rgba(43, 147, 72, 0.3); transition: 0.2s; }
        .comment-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(43, 147, 72, 0.5); }

        /* Form Card & Tree */
        .form-card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2a5298; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #1e3c72; border-bottom: 2px solid #ff9800; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; }
        .submit-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        .tree-container { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .pdf-btn { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .zoom-controls { display: flex; gap: 6px; align-items: center; }
        .zoom-btn { background: #2a5298; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        
        /* --- PERFECT TREE & MAP SCROLL CONTAINER FIX --- */
        .tree-container { 
            background: #fff; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            border-top: 5px solid #ff9800; 
            overflow: hidden;
        }

        .chart-scroll-wrapper { 
            width: 100%; 
            height: 600px; 
            overflow: auto; 
            background: #f8fafc; 
            border-radius: 12px; 
            padding: 20px; 
            position: relative;
        }

        #chart_wrapper_inner { 
            transform: none !important; /* उल्टापन पूरी तरह हटाने के लिए */
            display: inline-block;
            width: auto;
        }

        #chart_div { 
            display: inline-block;
            width: auto !important;
            margin: 0 auto;
        }
        
        /* बॉक्स की फिक्स्ड साइज (अब उल्टा करने की जरूरत नहीं, इसलिए transform हटा दिया) */
        .node-content-box { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 130px !important; 
            height: 85px !important;
            padding: 5px; 
            box-sizing: border-box; 
            text-align: center; 
            overflow: hidden; 
        }

        .google-visualization-orgchart-node { 
            cursor: pointer !important; 
            color: #ffffff !important; 
            border: 2px solid #ffffff !important; 
            border-radius: 12px !important; 
            padding: 0px !important; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            width: 135px !important; 
            height: 90px !important;
            background-image: none !important; 
        }
        
        .gen-0-node { background: linear-gradient(135deg, #b5370e 0%, #851c07 100%) !important; }
        .gen-1-node { background: linear-gradient(135deg, #1b365d 0%, #0f1f38 100%) !important; }
        .gen-2-node { background: linear-gradient(135deg, #0f5132 0%, #082c1b 100%) !important; }
        .gen-3-node { background: linear-gradient(135deg, #581845 0%, #2e0c24 100%) !important; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background: #ffffff; margin: 5% auto; padding: 25px 20px; border-radius: 16px; width: 90%; max-width: 450px; position: relative; border-top: 6px solid #11998e; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; }
        
        #cropperModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .cropper-container-box { background: #fff; width: 90%; max-width: 400px; margin: 10% auto; padding: 20px; border-radius: 12px; text-align: center; }
        .img-container { max-height: 300px; margin-bottom: 15px; }
        .img-container img { max-width: 100%; display: block; }
        .crop-action-btn { background: #2a5298; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>

<body>

    <input type="file" id="popupPhotoFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'popup')">

    <div id="cropperModal">
        <div class="cropper-container-box">
            <h3 style="margin-top:0; color:#1e3c72;" id="cropTitleText">फोटो क्रॉप करें</h3>
            <div class="img-container"><img id="imageToCrop" src=""></div>
            <button class="crop-action-btn" onclick="getCroppedImage()" id="cropBtnText">Crop & Save</button>
        </div>
    </div>

    <!-- सदस्य विवरण पॉपअप मॉडल -->
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBodyContent"></div>
        </div>
    </div>

    <div class="navbar">
        <button id="navTreeBtn" class="active" onclick="openTab(event, 'treePage')">🌳 Family Tree & Updates</button>
        <button id="navEntryBtn" onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content active">
        
        <!-- Top Feature Bar -->
        <div class="top-feature-bar">
            <!-- Language Dropdown -->
            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('langPanel')" id="langBtnText">🌐 Language (भाषा)</button>
                <div id="langPanel" class="dropdown-panel">
                    <label id="selectLangLabel">Select Language:</label>
                    <select id="langSelector" onchange="changeLanguage(this.value)">
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>

            <!-- Birthday / Tithi Dropdown -->
            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('tithiPanel')" id="tithiBtnText">📅 जन्मदिन / पुण्य तिथि</button>
                <div id="tithiPanel" class="dropdown-panel">
                    <label id="selectMemberLabel">सदस्य चुनें (Select Member):</label>
                    <select id="tithiSelectDropdown" onchange="selectMemberFromTithi(this.value)">
                        <option value="">-- लोड हो रहा है --</option>
                    </select>
                </div>
            </div>

            <!-- Member Search Dropdown -->
            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('searchPanel')" id="searchBtnText">🔍 मेंबर सर्च (अगली पीढ़ी)</button>
                <div id="searchPanel" class="dropdown-panel">
                    <label id="searchMemberLabel">सदस्य सर्च करें:</label>
                    <select id="memberSearchDropdown" onchange="filterNextGenTree(this.value)">
                        <option value="">-- पूरा ट्री देखें --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 7 Days Upcoming Events Slider Widget -->
        <div class="event-slider-card" id="upcomingSliderWidget" style="text-align: center;">
            <div class="event-header-title" id="sliderHeaderTitle">✨ आगामी 7 दिन - जन्मदिन / पुण्य तिथि</div>
            <div class="slider-content-box" id="sliderBodyContainer">
                <p id="loadingText" style="color: #fff;">डाटा लोड हो रहा है...</p>
            </div>
            
            <!-- Comment Box Section Inside Widget -->
            <div class="comment-section">
                <label id="commentBoxLabel" style="font-size:13px; text-align:left; color:#1d3557; font-weight:bold; display:block; margin-bottom:6px;">जन्मदिन / श्रद्धांजलि अर्पित करें (कमेंट बॉक्स):</label>
                <textarea id="visitorComment" placeholder="अपनी शुभकामनाएँ या संदेश यहाँ लिखें..."></textarea>
                <button class="comment-submit-btn" id="sendMsgBtn" onclick="postComment()">संदेश भेजें</button>
                <div style="clear: both;"></div>
            </div>
        </div>

        <!-- Family Tree Section -->
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#1e3c72;" id="treeHeadingTitle">परिवार का स्वर्णिम इतिहास</h2>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomTree(0.15)" id="zoomPlusBtn">➕ ज़ूम+</button>
                        <button class="zoom-btn" onclick="zoomTree(-0.15)" id="zoomMinusBtn">➖ ज़ूम-</button>
                        <button class="zoom-btn" onclick="resetZoom()" id="zoomResetBtn">↺ रीसेट</button>
                    </div>
                    <button class="pdf-btn" onclick="downloadPDF()" id="pdfBtnText">📥 Save as PDF</button>
                </div>
            </div>
            
            <div id="pdfContent" style="background: #fff; padding: 20px; border-radius: 10px;">
                <h3 style="text-align: center; color: #1e3c72; display:none;" id="pdfTitle">Family Tree Report</h3>
                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="chart_wrapper_inner">
                        <div id="chart_div">
                            <div id="treeLoadingText" style="text-align:center; padding:50px; color:#666; font-weight:bold; transform: scaleY(-1);">
                                Family Tree Load ho raha hai...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2 id="formTitleText">Naye Member ki Entry Karein</h2>
            <form id="entryForm" onsubmit="submitForm(event)">
               
                <div class="form-group">
                    <label>Member ID (ऑटो-जनरेटेड):</label>
                    <input type="text" id="memberIdField" readonly style="background-color: #e9ecef; font-weight: bold; color: #d9534f;">
                </div>

                <div class="form-group">
                    <label id="lblFather">Father / Parent:*</label>
                    <select id="fatherId" required><option value="">-- Select --</option></select>
                </div>
                <div class="form-group">
                    <label id="lblName">Member Name:*</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label id="lblGender">Gender:</label>
                    <select id="gender">
                        <option value="Male" id="optMale">Male</option>
                        <option value="Female" id="optFemale">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lblDob">D.O.B:</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label id="lblAliveDeath">Alive / Death:</label>
                    <select id="aliveDeath" onchange="toggleDeathFields('member')">
                        <option value="Alive" id="optAlive">Alive</option>
                        <option value="Death" id="optDeath">Death</option>
                    </select>
                </div>
               
                <div id="memberDeathContainer" style="display:none; background:#fff5f5; padding:10px; border:1px dashed #feb2b2; border-radius:6px; margin-bottom:15px;">
                    <div class="form-group">
                        <label id="lblDeathDate">Death Date:</label>
                        <input type="date" id="deathAnniversary" onchange="calculateDeathDay(this.value, 'deathDay')">
                    </div>
                    <div class="form-group">
                        <label id="lblDeathDay">Death Day (वार - ऑटोमैटिक):</label>
                        <input type="text" id="deathDay" readonly placeholder="वार ऑटोमैटिक आएगा">
                    </div>
                    <div class="form-group">
                        <label id="lblDeathTithi">Death Tithi:</label>
                        <input type="text" id="deathTithi">
                    </div>
                </div>

                <div class="form-group">
                    <label id="lblMarital">Marital Status:*</label>
                    <select id="maritalStatus" onchange="toggleSpouseFields()">
                        <option value="Married" id="optMarried">Married</option>
                        <option value="Unmarried" id="optUnmarried">Unmarried</option>
                    </select>
                </div>
               
                <div id="spouseFieldsContainer">
                    <div class="form-group"><label id="lblSpouseName">Spouse Name:</label><input type="text" id="spouseName"></div>
                    <div class="form-group"><label id="lblSpouseDob">Spouse D.O.B:</label><input type="date" id="spouseDob"></div>
                    <div class="form-group">
                        <label id="lblSpouseAliveDeath">Spouse Alive/Death:</label>
                        <select id="spouseAliveStatus" onchange="toggleDeathFields('spouse')">
                            <option value="Alive" id="optSpouseAlive">Alive</option>
                            <option value="Death" id="optSpouseDeath">Death</option>
                        </select>
                    </div>
                   
                    <div id="spouseDeathContainer" style="display:none; background:#fff5f5; padding:10px; border:1px dashed #feb2b2; border-radius:6px; margin-bottom:15px;">
                        <div class="form-group">
                            <label id="lblSpouseDeathDate">Spouse Death Date:</label>
                            <input type="date" id="spouseDeathAnniv" onchange="calculateDeathDay(this.value, 'spouseDeathDay')">
                        </div>
                        <div class="form-group">
                            <label id="lblSpouseDeathDay">Death Day (वार - ऑटोमैटिक):</label>
                            <input type="text" id="spouseDeathDay" readonly placeholder="वार ऑटोमैटिक आएगा">
                        </div>
                        <div class="form-group"><label id="lblSpouseDeathTithi">Death Tithi:</label><input type="text" id="spouseDeathTithi"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>बच्चा किस क्रम का है (Child Number):*</label>
                    <select id="childNumber" class="form-control" required>
                        <option value="">-- क्रम चुनें (पहला, दूसरा आदि) --</option>
                        <option value="1">पहला (1)</option>
                        <option value="2">दूसरा (2)</option>
                        <option value="3">तीसरा (3)</option>
                        <option value="4">चौथा (4)</option>
                        <option value="5">पाँचवा (5)</option>
                        <option value="6">छठवां (6)</option>
                        <option value="7">सातवां (7)</option>
                    </select>
                </div>

                <div class="form-group"><label id="lblMobile">Mobile:</label><input type="tel" id="mobile"></div>
                <div class="form-group"><label id="lblPhoto">Photo:</label><input type="file" id="photoFile" accept="image/*"></div>
                <button type="submit" class="submit-btn" id="submitBtnText">Submit & Save</button>
            </form>
        </div>
    </div>

    <script>
        // यहाँ अपना सही Google Apps Script Web App URL डालें
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxSaAJ8pIrZz9nta8AG0sROBHXfVD1IIDDQgN3iaK3yM4evHWfnhvjhEr7QuBxvfK6DdQ/exec';
        let globalData = [];
        let currentScale = 0.5;
        let sliderIndex = 0;
        let sliderEventsList = [];

        function generateMemberId() {
            const uniqueId = 'MEM_' + Date.now();
            const idField = document.getElementById('memberIdField');
            if (idField) {
                idField.value = uniqueId;
            }
        }

        function calculateDeathDay(dateString, targetFieldId) {
            if (!dateString) return;
            const days = ['रविवार (Sunday)', 'सोमवार (Monday)', 'मंगलवार (Tuesday)', 'बुधवार (Wednesday)', 'गुरुवार (Thursday)', 'शुक्रवार (Friday)', 'शनिवार (Saturday)'];
            const date = new Date(dateString);
            const dayIndex = date.getDay();
            const targetField = document.getElementById(targetFieldId);
            if (targetField) {
                targetField.value = days[dayIndex];
            }
        }

        // Google Chart लोड करें और डेटा फैच करें
        google.charts.load('current', {packages:['orgchart']});
        google.charts.setOnLoadCallback(fetchFamilyData);

        function fetchFamilyData() {
            fetch(scriptURL + '?action=getData')
                .then(res => res.json())
                .then(data => {
                    globalData = data;
                    let loadingEl = document.getElementById('treeLoadingText');
                    if(loadingEl) loadingEl.style.display = 'none';
                    
                    if(!data || data.length === 0) {
                        document.getElementById('sliderBodyContainer').innerHTML = `<p style="color:#fff; padding:15px;">डेटा उपलब्ध नहीं है।</p>`;
                        return;
                    }

                    populateDropdowns(data);
                    processUpcomingEvents(data);
                    drawChart(data);
                })
                .catch(err => {
                    console.error("Error fetching data:", err);
                    document.getElementById('treeLoadingText').innerText = "डेटा लोड करने में त्रुटि हुई!";
                });
        }

        function populateDropdowns(data) {
            let fatherSelect = document.getElementById('fatherId');
            if(!fatherSelect) return;
            fatherSelect.innerHTML = `<option value="">-- Select Parent --</option>`;
            data.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = `${item.name} (ID: ${item.memberId})`;
                fatherSelect.appendChild(opt);
            });
        }

        function processUpcomingEvents(data) {
            sliderEventsList = [];
            let today = new Date();
            
            data.forEach(item => {
                if(item.aliveDeath === 'Death' && item.deathAnniversary) {
                    let dDate = new Date(item.deathAnniversary);
                    if(isWithinNext7Days(today, dDate)) {
                        sliderEventsList.push({ type: 'पुण्य तिथि (Death Anniversary)', item: item });
                    }
                }
                if(item.dob) {
                    let bDate = new Date(item.dob);
                    if(isWithinNext7Days(today, bDate)) {
                        sliderEventsList.push({ type: 'जन्मदिन (Birthday)', item: item });
                    }
                }
            });

            if(sliderEventsList.length > 0) {
                renderSliderItem(0);
                if(sliderEventsList.length > 1) {
                    setInterval(() => {
                        sliderIndex = (sliderIndex + 1) % sliderEventsList.length;
                        renderSliderItem(sliderIndex);
                    }, 5000);
                }
            } else {
                document.getElementById('sliderHeaderTitle').innerText = "✨ आगामी 7 दिन - कोई विशेष तिथि नहीं";
                document.getElementById('sliderBodyContainer').innerHTML = `<p style="color:#e2e8f0; font-weight:600; padding:15px;">आगामी 7 दिनों में परिवार में कोई जन्मदिन या पुण्य तिथि नहीं है।</p>`;
            }
        }

        function isWithinNext7Days(today, targetDate) {
            return (today.getMonth() === targetDate.getMonth() && targetDate.getDate() >= today.getDate() && targetDate.getDate() <= today.getDate() + 7);
        }

        function renderSliderItem(index) {
            let ev = sliderEventsList[index];
            let item = ev.item;
            
            document.getElementById('sliderHeaderTitle').innerText = `✨ ${ev.type}`;
            let photoHtml = item.photo ? `<img src="${item.photo}" class="slider-img">` : `<div class="slider-img" style="display:flex; align-items:center; justify-content:center; background:#e2e8f0; font-size:45px; color:#4a5568; font-weight:bold;">${item.name.charAt(0)}</div>`;
            
            let detailsHtml = `
                <div style="margin-bottom:8px; border-bottom:2px solid #e2e8f0; padding-bottom:6px;">
                    <span style="font-size:20px; font-weight:800; color:#1d3557; display:block;">${item.name}</span>
                    <span style="font-size:12px; font-weight:700; color:#e63946; background:#ffe5ec; padding:2px 8px; border-radius:6px; display:inline-block; margin-top:3px;">ID: ${item.memberId}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:14px;"><strong>पिता:</strong> <span>${item.fatherId || 'Root'}</span></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:14px;"><strong>मोबाइल:</strong> <span>${item.mobile || 'N/A'}</span></div>
                <button class="edit-profile-btn" onclick="showMemberDetailsModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">📂 पूरी जानकारी देखें</button>
            `;

            document.getElementById('sliderBodyContainer').innerHTML = `
                <div class="slider-img-wrapper">${photoHtml}</div>
                <div class="slider-details">${detailsHtml}</div>
            `;
        }

        function drawChart(dataToDraw) {
            if (!dataToDraw || dataToDraw.length === 0) return;

            let chartData = new google.visualization.DataTable();
            chartData.addColumn('string', 'Entity');
            chartData.addColumn('string', 'Parent');
            chartData.addColumn('string', 'ToolTip');

            let rows = [];
            let nameSet = new Set(dataToDraw.map(item => item.name ? item.name.trim() : ''));

            dataToDraw.forEach(item => {
                let mName = item.name ? item.name.trim() : '';
                let pId = item.fatherId ? item.fatherId.trim() : '';

                if (!pId || !nameSet.has(pId)) {
                    pId = ''; 
                }

                let genClass = pId === '' ? 'gen-0-node' : 'gen-1-node';

                let photoHtml = item.photo ? `<img src="${item.photo}" style="width:30px; height:30px; border-radius:50%; object-fit:cover; border:2px solid #fff; margin-bottom:2px;">` : `<div style="width:30px; height:30px; border-radius:50%; background:#ddd; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; color:#555; margin-bottom:2px;">${mName.charAt(0)}</div>`;
                
                let spouseText = (item.maritalStatus === 'Married' && item.spouseName) ? `<div style="font-size:8px; opacity:0.95; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;">${item.spouseName}</div>` : '';

                let nodeContent = `
                    <div class="node-content-box ${genClass}" onclick='showMemberDetailsModal(${JSON.stringify(item).replace(/"/g, '&quot;')})'>
                        ${photoHtml}
                        <div style="font-weight:bold; font-size:10px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;">${mName}</div>
                        ${spouseText}
                    </div>
                `;
                rows.push([{v: mName, f: nodeContent}, pId, mName]);
            });

            chartData.addRows(rows);
            let chartDiv = document.getElementById('chart_div');
            chartDiv.innerHTML = '';
            
            let chart = new google.visualization.OrgChart(chartDiv);
            chart.draw(chartData, {
                allowHtml: true, 
                nodeClass: 'google-visualization-orgchart-node',
                size: 'small', // यह बॉक्स और लाइनों के बीच की फालतू दूरी को कम कर देगा
                compactRows: true,
                allowCollapse: true
            });
        }   
        
        function showMemberDetailsModal(member) {
            let spouseSection = '';
            if (member.spouseName) {
                spouseSection = `
                    <div style="background: #f8f9fa; padding: 10px; margin-top: 12px; border-radius: 8px; border-left: 4px solid #ff9800;">
                        <strong style="color: #1e3c72;">Spouse Details (पति/पत्नी विवरण):</strong>
                        <div style="margin-top:6px; font-size:13px;"><strong>Spouse Name:</strong> ${member.spouseName}</div>
                        <div style="font-size:13px;"><strong>Spouse DOB:</strong> ${member.spouseDob || 'N/A'}</div>
                        <div style="font-size:13px;"><strong>Spouse Death Day:</strong> ${member.spouseDeathDay || 'N/A'}</div>
                        <div style="font-size:13px;"><strong>Spouse Death Tithi:</strong> ${member.spouseDeathTithi || 'N/A'}</div>
                    </div>
                `;
            }

            let modalBody = document.getElementById('modalBodyContent');
            modalBody.innerHTML = `
                <h3 style="color: #1e3c72; margin-top:0;">${member.name || 'N/A'}</h3>
                <div style="margin-bottom:6px; font-size:13px;"><strong>Member ID:</strong> ${member.memberId || 'N/A'}</div>
                <div style="margin-bottom:6px; font-size:13px;"><strong>Father Name:</strong> ${member.fatherId || 'N/A'}</div>
                <div style="margin-bottom:6px; font-size:13px;"><strong>Mobile:</strong> ${member.mobile || 'N/A'}</div>
                <div style="margin-bottom:6px; font-size:13px;"><strong>Child Number (क्रम):</strong> ${member.childNumber || 'N/A'}</div>
                ${spouseSection}
            `;
            document.getElementById('memberModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = 'none';
        }

        function toggleDeathFields(type) {
            if (type === 'member') {
                const status = document.getElementById('aliveDeath').value;
                document.getElementById('memberDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            } else if (type === 'spouse') {
                const status = document.getElementById('spouseAliveStatus').value;
                document.getElementById('spouseDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            }
        }

        function toggleSpouseFields() {
            const status = document.getElementById('maritalStatus').value;
            document.getElementById('spouseFieldsContainer').style.display = (status === 'Married') ? 'block' : 'none';
        }

        function openTab(evt, tabName) {
            const contents = document.getElementsByClassName('tab-content');
            for (let c of contents) c.classList.remove('active');
            const buttons = document.getElementsByClassName('navbar')[0].getElementsByTagName('button');
            for (let b of buttons) b.classList.remove('active');
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function toggleDropdown(panelId) {
            const panel = document.getElementById(panelId);
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        window.onload = function() {
            generateMemberId();
        };
function submitForm(event) {
            event.preventDefault();
            
            let photoInput = document.getElementById('photoFile');
            let file = photoInput.files[0];

            if (file) {
                let reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function () {
                    sendDataToSheet(reader.result);
                };
            } else {
                sendDataToSheet('');
            }
        }

        function sendDataToSheet(base64Photo) {
            let formData = {
                memberId: document.getElementById('memberIdField').value,
                fatherId: document.getElementById('fatherId').value,
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                deathDay: document.getElementById('deathDay').value,
                deathTithi: document.getElementById('deathTithi').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                spouseName: document.getElementById('spouseName').value,
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveStatus').value,
                spouseDeathAnniv: document.getElementById('spouseDeathAnniv').value,
                spouseDeathDay: document.getElementById('spouseDeathDay').value,
                spouseDeathTithi: document.getElementById('spouseDeathTithi').value,
                childNumber: document.getElementById('childNumber').value, // चाइल्ड नंबर
                mobile: document.getElementById('mobile').value,
                photo: base64Photo // फोटो का बेस64 स्ट्रिंग
            };

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                alert('नया डेटा और फोटो सफलतापूर्वक सेव हो गए हैं!');
                location.reload();
            })
            .catch(err => {
                console.error("Save Error:", err);
                alert('डेटा सेव करने में त्रुटि हुई!');
            });
        }
        
    </script>
</body>
</html>
