<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Curved Branch Family Tree</title>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Cropper.js CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); color: #333; min-height: 100vh; }
        
        .navbar { background: linear-gradient(90deg, #2e7d32 0%, #1b5e20 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; letter-spacing: 0.5px; }
        .navbar button:hover { background-color: rgba(255,255,255,0.15); }
        .navbar button.active { background-color: #ffb300; color: #1b5e20; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }

        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: auto; }
        .tab-content.active { display: block; }

        .form-card { background: #fff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2e7d32; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #2e7d32; border-bottom: 2px solid #ffb300; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; transition: 0.3s; }
        input:focus, select:focus { border-color: #2e7d32; outline: none; box-shadow: 0 0 8px rgba(46,125,50,0.2); }
        .submit-btn { background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(46,125,50,0.3); }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .contact-note { background: #fff3cd; border-left: 5px solid #ffb300; padding: 15px; border-radius: 8px; margin-top: 25px; font-size: 14px; color: #856404; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .contact-note a { color: #d35400; font-weight: bold; text-decoration: none; }
        .contact-note a:hover { text-decoration: underline; }

        .tree-container { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #ffb300; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .pdf-btn { background: linear-gradient(135deg, #d32f2f 0%, #f44336 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(211,47,47,0.3); transition: 0.3s; }
        .pdf-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* --- ORGANIC TREE CANVAS CONTAINER --- */
        .chart-scroll-wrapper { 
            width: 100%; 
            overflow: auto; 
            display: block; 
            padding: 20px; 
            min-height: 700px; 
            background: radial-gradient(circle, #f1f8e9 0%, #dcedc8 100%); 
            border-radius: 12px; 
            border: 2px dashed #81c784; 
            position: relative;
        }

#tree-canvas-area {
    position: relative;
    width: 5000px;
    height: 2500px;
    margin: 0 auto;
    transform: scale(0.4); /* <--- 1 से कम (जैसे 0.8) करने पर पूरा ग्राफ़ छोटा हो जाएगा, 1.2 करने पर बड़ा */
    transform-origin: top center; /* परफेक्शन के लिए सेंटर से स्केल होगा */
}

        }

        /* SVG Curved Branches Layer */
        #branch-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* --- MODERN ORGANIC LEAF NODES --- */
        .node-card {
            position: absolute;
            cursor: pointer;
            color: #263238;
            background: linear-gradient(135deg, #ffffff 0%, #f1f8e9 100%);
            border: 3px solid #558b2f;
            border-radius: 30px;
            padding: 10px 14px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(85, 139, 47, 0.3), inset 0 2px 6px rgba(255,255,255,0.9);
            z-index: 2;
            text-align: center;
            width: 170px;
            box-sizing: border-box;
        }

        .node-card:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
            border-color: #f57f17;
            box-shadow: 0 14px 30px rgba(245, 127, 23, 0.4);
            z-index: 10;
        }

        /* Generation Leaf Colors */
        .gen-0-node {
            background: linear-gradient(135deg, #ffe082 0%, #ffb300);
            border-color: #e65100;
            color: #fff;
        }
        .gen-0-node b { color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

        .gen-1-node {
            background: linear-gradient(135deg, #dcedc8 0%, #aed581);
            border-color: #33691e;
        }

        .gen-2-node {
            background: linear-gradient(135deg, #b2dfdb 0%, #80cbc4);
            border-color: #004d40;
        }

        .gen-3-node {
            background: linear-gradient(135deg, #c5cae9 0%, #9fa8da);
            border-color: #1a237e;
        }

        /* --- EXACT ORIGINAL POPUP MODAL DESIGN --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: #ffffff; margin: 5% auto; padding: 25px; border-radius: 12px; width: 340px; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; text-align: left; }
        .close-btn { color: #aaa; float: right; font-size: 24px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; transition: 0.2s; }
        .close-btn:hover { color: #000; }
        
        .edit-profile-btn {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; margin: 8px auto 12px auto; display: block; box-shadow: 0 2px 6px rgba(245,124,0,0.3); transition: 0.3s;
        }
        .edit-profile-btn:hover { opacity: 0.9; }

        #cropperModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .cropper-container-box { background: #fff; width: 90%; max-width: 400px; margin: 10% auto; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .img-container { max-height: 300px; margin-bottom: 15px; }
        .img-container img { max-width: 100%; display: block; }
        .crop-action-btn { background: #2e7d32; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>

<body>

    <input type="file" id="popupPhotoFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'popup')">

    <div id="cropperModal">
        <div class="cropper-container-box">
            <h3 style="margin-top:0; color:#2e7d32;">फोटो क्रॉप करें (Adjust Face)</h3>
            <div class="img-container">
                <img id="imageToCrop" src="">
            </div>
            <button class="crop-action-btn" onclick="getCroppedImage()">Crop & Save</button>
        </div>
    </div>

    <div class="navbar">
        <button id="defaultOpen" onclick="openTab(event, 'treePage')">🌳 Organic Curved Tree</button>
        <button onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content">
        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#2e7d32; font-size:20px;">🌿 प्राकृतिक घुमावदार टहनियों वाला वृक्ष (Organic Curved Branches)</h2>
                <button class="pdf-btn" onclick="downloadPDF()">📥 Save as PDF</button>
            </div>

            <p style="color: #555; font-size: 12px; margin-bottom: 10px;">
                किसी भी सदस्य के बॉक्स पर क्लिक करके पूरी जानकारी देखें:
            </p>
            
            <div id="pdfContent" style="background: #f1f8e9; padding: 15px; border-radius: 10px;">
                <h3 style="text-align: center; color: #2e7d32; display:none;" id="pdfTitle">Organic Family Tree Report</h3>

                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="tree-canvas-area">
                        <svg id="branch-svg"></svg>
                        <div id="nodes-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2>Naye Member ki Entry Karein</h2>

            <form id="entryForm">
                <div class="form-group">
                    <label>Father / Parent (पिता का पूरा नाम चुनें):*</label>
                    <select id="fatherId" required>
                        <option value="">-- Member List Load ho rahi hai --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Member Name (सदस्य का पूरा नाम):*</label>
                    <input type="text" id="name" placeholder="Member ka naam likhein" required>
                </div>
            
                <div class="form-group">
                    <label>Child Level (संतान क्रम):</label>
                    <input type="number" id="childOrder" placeholder="Jaise: 1, 2, 3..." min="1">
                </div>

                <div class="form-group">
                    <label>Gender (लिंग):</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>D.O.B (जन्म दिनांक):</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group">
                    <label>Alive / Death (जीवित / स्वर्गवासी):</label>
                    <select id="aliveDeath">
                        <option value="Alive">Alive</option>
                        <option value="Death">Death</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Death Anniversary (पुण्यतिथि):</label>
                    <input type="date" id="deathAnniversary">
                </div>
            
                <div class="form-group">
                    <label>Marital Status (विवाह की स्थिति):*</label>
                    <select id="maritalStatus" onchange="toggleSpouseFields()">
                        <option value="Married">Married</option>
                        <option value="Unmarried">Unmarried</option>
                    </select>
                </div>

                <div id="spouseFieldsContainer">
                    <div class="form-group">
                        <label>Spouse Name (पति/पत्नी का नाम):</label>
                        <input type="text" id="spouseName" placeholder="Pati/Patni ka naam">
                    </div>
                    <div class="form-group">
                        <label>Spouse D.O.B:</label>
                        <input type="date" id="spouseDob">
                    </div>
                    <div class="form-group">
                        <label>Spouse Alive / Death:</label>
                        <select id="spouseAliveDeath">
                            <option value="Alive">Alive</option>
                            <option value="Death">Death</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Spouse Death Anniversary:</label>
                        <input type="date" id="spouseDeathAnniv">
                    </div>
                </div>
            
                <div class="form-group">
                    <label>Mobile Number (मोबाइल नंबर):</label>
                    <input type="tel" id="mobile" placeholder="Mobile Number dalein">
                </div>

                <div class="form-group">
                    <label>Member Photo ( HD फोटो ):</label>
                    <input type="file" id="photoFile" accept="image/*" onchange="handleFileSelect(this, 'entry')">
                </div>

                <button type="submit" class="submit-btn">Submit & Save to Sheet</button>
            </form>

            <div class="contact-note">
                ⚠️ <b>विशेष सूचना:</b> किसी भी बदलाव के लिए संपर्क करें - <br>
                <b>Purushottam Tiwari</b> | 📞 <a href="tel:9752266047">9752266047</a>
            </div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxSaAJ8pIrZz9nta8AG0sROBHXfVD1IIDDQgN3iaK3yM4evHWfnhvjhEr7QuBxvfK6DdQ/exec';
        let globalData = [];
        let currentEditingMemberId = '';
        let cropper = null;
        let activeUploadType = ''; 
        let finalProcessedPhoto = '';

        function getSafeId(nameStr) {
            if (!nameStr) return '';
            return nameStr.toString().trim().replace(/[^a-zA-Z0-9]/g, '_');
        }

        function handleFileSelect(input, type) {
            activeUploadType = type;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageElement = document.getElementById('imageToCrop');
                    imageElement.src = e.target.result;
                    document.getElementById('cropperModal').style.display = 'block';

                    if (cropper) {
                        cropper.destroy();
                    }
                    cropper = new Cropper(imageElement, {
                        aspectRatio: 1,
                        viewMode: 1,
                        autoCropArea: 0.9
                    });
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCroppedImage() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({
                width: 400,
                height: 400
            });
            finalProcessedPhoto = canvas.toDataURL('image/jpeg', 0.9);

            document.getElementById('cropperModal').style.display = 'none';
            cropper.destroy();
            cropper = null;

            if (activeUploadType === 'popup') {
                let member = globalData.find(m => {
                    let mName = m.name ? m.name.toString().trim() : (m.memberId ? m.memberId.toString().trim() : '');
                    return mName === currentEditingMemberId;
                });
                if (member) {
                    member.photo = finalProcessedPhoto;
                    showPopup(member);
                    renderOrganicTree(globalData);
                    updatePhotoInSheet(currentEditingMemberId, finalProcessedPhoto);
                }
            } else {
                alert("फोटो सफलतापूर्वक क्रॉप हो चुकी है! अब आप 'Submit & Save to Sheet' पर क्लिक करें।");
            }
        }

        function toggleSpouseFields() {
            var status = document.getElementById('maritalStatus').value;
            var container = document.getElementById('spouseFieldsContainer');
            if (status === 'Unmarried') {
                container.style.display = 'none';
                document.getElementById('spouseName').value = '';
                document.getElementById('spouseDob').value = '';
                document.getElementById('spouseDeathAnniv').value = '';
            } else {
                container.style.display = 'block';
            }
        }

        function openTab(event, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("navbar")[0].getElementsByTagName("button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            event.currentTarget.className += " active";
        }

        document.getElementById("defaultOpen").click();

        window.addEventListener('DOMContentLoaded', () => {
            fetchDataAndDrawChart();
        });

        function fetchDataAndDrawChart() {
            fetch(scriptURL)
            .then(response => response.json())
            .then(jsonData => {
                globalData = jsonData.map((row) => {
                    return {
                        fatherId: row.fatherId !== undefined ? row.fatherId : (row[0] || ''),
                        memberId: row.memberId !== undefined ? row.memberId : (row[1] || ''),
                        name: row.name !== undefined ? row.name : (row[2] || ''),
                        dob: row.dob !== undefined ? row.dob : (row[3] || ''),
                        aliveDeath: row.aliveDeath !== undefined ? row.aliveDeath : (row[4] || 'Alive'),
                        deathAnniversary: row.deathAnniversary !== undefined ? row.deathAnniversary : (row[5] || ''),
                        maritalStatus: row.maritalStatus !== undefined ? row.maritalStatus : (row[6] || 'Married'),
                        spouseName: row.spouseName !== undefined ? row.spouseName : (row[7] || ''),
                        spouseDob: row.spouseDob !== undefined ? row.spouseDob : (row[8] || ''),
                        spouseAliveDeath: row.spouseAliveDeath !== undefined ? row.spouseAliveDeath : (row[9] || 'Alive'),
                        spouseDeathAnniv: row.spouseDeathAnniv !== undefined ? row.spouseDeathAnniv : (row[10] || ''),
                        mobile: row.mobile !== undefined ? row.mobile : (row[11] || ''),
                        photo: row.photo !== undefined ? row.photo : (row[12] || ''),
                        childOrder: row.childOrder !== undefined ? Number(row.childOrder) : 99,
                        gender: row.gender !== undefined ? row.gender : (row[13] || 'Male')
                    };
                });

                populateFatherDropdown();
                renderOrganicTree(globalData);
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('nodes-container').innerHTML = '<div style="color:red; text-align:center; padding:20px;">Data load karne mein samasya aayi hai. Kripya connection check karein.</div>';
            });
        }

        function populateFatherDropdown() {
            const select = document.getElementById('fatherId');
            select.innerHTML = '<option value="">-- Root Member / Parent Chunein --</option>';
            
            globalData.forEach(member => {
                let mName = member.name ? member.name.toString().trim() : (member.memberId ? member.memberId.toString().trim() : '');
                if (mName) {
                    let opt = document.createElement('option');
                    opt.value = mName;
                    opt.textContent = mName + (member.spouseName ? ' & ' + member.spouseName : '');
                    select.appendChild(opt);
                }
            });
        }

        // --- ORGANIC CURVED TREE LAYOUT ENGINE ---
        function renderOrganicTree(dataArray) {
            const container = document.getElementById('nodes-container');
            const svg = document.getElementById('branch-svg');
            container.innerHTML = '';
            svg.innerHTML = '';

            if (!dataArray || dataArray.length === 0) return;

            let map = {};
            dataArray.forEach(m => {
                let name = m.name ? m.name.toString().trim() : (m.memberId ? m.memberId.toString().trim() : '');
                if (name) {
                    if (!map[name]) {
                        map[name] = { ...m, children: [] };
                    } else {
                        map[name] = { ...map[name], ...m, children: map[name].children };
                    }
                }
            });

            let roots = [];
            let nodeMap = {};

            Object.values(map).forEach(node => {
                nodeMap[node.name] = node;
            });

            Object.values(map).forEach(node => {
                let fId = node.fatherId ? node.fatherId.toString().trim() : '';
                if (fId && nodeMap[fId]) {
                    nodeMap[fId].children.push(node);
                } else {
                    roots.push(node);
                }
            });

            Object.values(nodeMap).forEach(node => {
                node.children.sort((a, b) => (a.childOrder || 99) - (b.childOrder || 99));
            });

            // Safe starting X coordinate to prevent left-side cutting
            let startX = 2500; 
            let startY = 80;
            let levelHeight = 160;

            function measureSubtree(node) {
                if (!node.children || node.children.length === 0) {
                    node.subtreeWidth = 190;
                    return 190;
                }
                let w = 0;
                node.children.forEach(c => {
                    w += measureSubtree(c);
                });
                node.subtreeWidth = Math.max(190, w);
                return node.subtreeWidth;
            }

            roots.forEach(r => measureSubtree(r));

            let nodePositions = {};

            function layoutNode(node, x, y, depth) {
                node.x = x;
                node.y = y;
                nodePositions[node.name] = { x: x + 85, y: y + 40 };

                let currentX = x - (node.subtreeWidth / 2);
                if (node.children && node.children.length > 0) {
                    node.children.forEach(c => {
                        let childW = c.subtreeWidth;
                        layoutNode(c, currentX + (childW / 2), y + levelHeight, depth + 1);
                        currentX += childW;
                    });
                }
            }

            let rootXOffset = startX;
            roots.forEach(r => {
                layoutNode(r, rootXOffset, startY, 0);
                rootXOffset += r.subtreeWidth + 100;
            });

            function renderRecursive(node) {
                let memberName = node.name;
                let defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                let photoSrc = (node.photo && node.photo.length > 10) ? node.photo : defaultAvatar;

                let genLevel = 0;
                let p = nodeMap[node.fatherId];
                let tempDepth = 0;
                while(p) {
                    tempDepth++;
                    p = nodeMap[p.fatherId];
                }
                genLevel = tempDepth;
                let genClass = 'gen-' + (genLevel > 3 ? '3' : genLevel) + '-node';

                let card = document.createElement('div');
                card.className = `node-card ${genClass}`;
                card.style.left = node.x + 'px';
                card.style.top = node.y + 'px';
                card.innerHTML = `
                    <img src="${photoSrc}" style="width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid #558b2f; margin-bottom:3px; box-shadow:0 3px 6px rgba(0,0,0,0.15);" /><br>
                    <b style="font-size:12px; color:#1b5e20;">${memberName}</b>
                    ${node.spouseName ? '<br><span style="font-size:10px; color:#4e342e;">w/o ' + node.spouseName + '</span>' : ''}
                `;
                card.onclick = () => openMemberModal(memberName);
                container.appendChild(card);

                if (node.children && node.children.length > 0) {
                    let parentPos = nodePositions[node.name];

                    node.children.forEach(child => {
                        let childPos = nodePositions[child.name];
                        if (childPos) {
                            let x1 = parentPos.x;
                            let y1 = parentPos.y + 20;
                            let x2 = childPos.x;
                            let y2 = childPos.y - 40;
                            
                            let midY = (y1 + y2) / 2;
                            let pathData = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;

                            let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                            path.setAttribute("d", pathData);
                            path.setAttribute("stroke", "#5d4037");
                            path.setAttribute("stroke-width", "4");
                            path.setAttribute("fill", "none");
                            path.setAttribute("stroke-linecap", "round");
                            svg.appendChild(path);
                        }
                        renderRecursive(child);
                    });
                }
            }

            roots.forEach(r => renderRecursive(r));

            // Auto-scroll to center on load
            setTimeout(() => {
                const wrapper = document.getElementById('scrollWrapper');
                wrapper.scrollLeft = startX - (wrapper.clientWidth / 2);
            }, 100);
        }

        function openMemberModal(memberName) {
            let member = globalData.find(m => {
                let mName = m.name ? m.name.toString().trim() : (m.memberId ? m.memberId.toString().trim() : '');
                return mName === memberName;
            });
            if (member) {
                currentEditingMemberId = memberName;
                showPopup(member);
            }
        }

        // --- RESTORED EXACT ORIGINAL POPUP DESIGN ---
        function showPopup(member) {
            let defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
            let photoSrc = (member.photo && member.photo.length > 10) ? member.photo : defaultAvatar;

            let html = `
                <div style="text-align: center;">
                    <img src="${photoSrc}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #2e7d32; box-shadow:0 3px 10px rgba(0,0,0,0.2);"/>
                    <button class="edit-profile-btn" onclick="triggerPopupPhotoUpload()">✏️ Edit Profile / Photo</button>
                    <h3 style="margin:5px 0 12px 0; color:#1b5e20; border-bottom:2px solid #2e7d32; padding-bottom:8px;">${member.name || 'N/A'}</h3>
                </div>
                <div style="font-size: 14px; line-height: 1.6; color: #333;">
                    <p style="margin: 6px 0;"><b>Child Level:</b> ${member.childOrder || '1'}</p>
                    <p style="margin: 6px 0;"><b>Father Name:</b> ${member.fatherId || 'Root / Top'}</p>
                    <p style="margin: 6px 0;"><b>Gender:</b> ${member.gender || 'Male'}</p>
                    <p style="margin: 6px 0;"><b>Marital Status:</b> <span style="color:#0277bd; font-weight:bold;">${member.maritalStatus || 'Married'}</span> ${member.spouseName ? '(& w/o ' + member.spouseName + ')' : ''}</p>
                    <p style="margin: 6px 0;"><b>D.O.B:</b> ${member.dob || 'N/A'}</p>
                    <p style="margin: 6px 0;"><b>Status:</b> <span style="color:${member.aliveDeath === 'Death' ? '#d32f2f' : '#2e7d32'}; font-weight:bold;">${member.aliveDeath || 'Alive'}</span> ${member.deathAnniversary ? '('+member.deathAnniversary+')' : ''}</p>
                    <hr style="border:0; border-top:1px solid #ddd; margin: 12px 0;">
                    <p style="margin: 6px 0;"><b>Mobile Number:</b> <a href="tel:${member.mobile}" style="color:#2e7d32; font-weight:bold; text-decoration:none;">${member.mobile || 'N/A'}</a></p>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('detailsModal').style.display = 'block';
        }

        function triggerPopupPhotoUpload() {
            document.getElementById('popupPhotoFile').click();
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function updatePhotoInSheet(memberName, base64Photo) {
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'updatePhoto', memberId: memberName, photo: base64Photo })
            })
            .then(() => console.log('Photo updated in sheet successfully'))
            .catch(err => console.error('Error updating photo:', err));
        }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let formData = {
                fatherId: document.getElementById('fatherId').value,
                name: document.getElementById('name').value.trim(),
                childOrder: document.getElementById('childOrder').value || 99,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                spouseName: document.getElementById('spouseName').value.trim(),
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveDeath').value,
                spouseDeathAnniv: document.getElementById('spouseDeathAnniv').value,
                mobile: document.getElementById('mobile').value.trim(),
                photo: finalProcessedPhoto || ''
            };

            let submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert('Data safaltapurvak save ho gaya hai!');
                document.getElementById('entryForm').reset();
                finalProcessedPhoto = '';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit & Save to Sheet';
                fetchDataAndDrawChart();
                openTab({currentTarget: document.querySelector('.navbar button:first-child')}, 'treePage');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Data save karne mein error aayi hai.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit & Save to Sheet';
            });
        });

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            document.getElementById('pdfTitle').style.display = 'block';
            
            let opt = {
                margin:       0.5,
                filename:     'Family_Tree_Report.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                document.getElementById('pdfTitle').style.display = 'none';
            });
        }
    </script>
</body>
