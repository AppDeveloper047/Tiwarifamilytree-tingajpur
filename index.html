<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree View & Updates</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        .gradient-highlight-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f72585 0%, #7209b7 50%, #4361ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            line-height: 1.3;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%); overflow: hidden; display: flex; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .navbar button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 16px 30px; font-size: 16px; color: white; transition: 0.3s; font-weight: bold; }
        .navbar button:hover { background-color: rgba(255,255,255,0.1); }
        .navbar button.active { background-color: #ff9800; color: white; }
        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: auto; }
        .tab-content.active { display: block; }

        .top-feature-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .feature-dropdown-container { position: relative; display: inline-block; }
        .feature-btn { background: #1e3c72; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.2s; }
        .feature-btn:hover { background: #2a5298; }

        .dropdown-panel { display: none; position: absolute; background: #fff; min-width: 320px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border-radius: 10px; z-index: 100; left: 0; top: 50px; padding: 15px; border-top: 4px solid #ff9800; }
        .dropdown-panel select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; margin-top: 5px; }

        @keyframes fadeInSlide {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes premiumGlow {
            0% { box-shadow: 0 15px 35px rgba(10, 38, 71, 0.2); }
            50% { box-shadow: 0 20px 45px rgba(24, 119, 242, 0.35); }
            100% { box-shadow: 0 15px 35px rgba(10, 38, 71, 0.2); }
        }

        .event-slider-card { 
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%); 
            border-radius: 20px; 
            padding: 30px; 
            margin-bottom: 30px; 
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); 
            position: relative;
            overflow: hidden;
            animation: premiumGlow 5s infinite;
        }
        
        .event-header-title { 
            font-size: 17px; 
            font-weight: 800; 
            color: #fff; 
            margin-bottom: 22px; 
            background: linear-gradient(135deg, #f72585 0%, #7209b7 100%); 
            padding: 8px 24px; 
            border-radius: 30px; 
            display: inline-block;
            box-shadow: 0 4px 15px rgba(114, 9, 183, 0.4);
            letter-spacing: 0.5px;
        }

        .slider-content-box { 
            display: flex; 
            align-items: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 100%; 
            animation: fadeInSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slider-img-wrapper {
            position: relative;
            padding: 5px;
            background: linear-gradient(135deg, #ff9e00 0%, #ff0054 50%, #9b5de5 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .slider-img { 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #fff; 
            display: block;
        }

        .slider-details { 
            text-align: left; 
            max-width: 600px; 
            font-size: 15px; 
            line-height: 1.8; 
            background: rgba(255, 255, 255, 0.95);
            padding: 22px 28px;
            border-radius: 16px;
            border-left: 6px solid #4361ee;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            flex: 1;
            min-width: 290px;
            color: #1e293b;
        }

        .edit-profile-btn { 
            background: linear-gradient(135deg, #f77f00 0%, #fcbf49 100%); 
            color: #432818; 
            border: none; 
            padding: 9px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            margin-top: 12px; 
            box-shadow: 0 4px 12px rgba(247, 127, 0, 0.4);
            transition: 0.2s;
        }
        .edit-profile-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(247, 127, 0, 0.6); }

        .comment-section-card { 
            background: #ffffff; 
            border-radius: 18px; 
            padding: 25px; 
            margin-bottom: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            border-top: 5px solid #2b9348;
        }
        .comment-section-card h3 { margin-top: 0; color: #1e3c72; font-size: 18px; margin-bottom: 15px; }
        .comment-section-card textarea { width: 100%; height: 85px; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; resize: none; box-sizing: border-box; font-family: inherit; font-size: 14px; margin-bottom: 10px; }
        .comment-submit-btn { background: linear-gradient(135deg, #2b9348 0%, #55a630 100%); color: white; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; float: right; box-shadow: 0 4px 12px rgba(43, 147, 72, 0.3); transition: 0.2s; }
        .comment-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(43, 147, 72, 0.5); }
        
        .comments-display-list { max-height: 220px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 15px; clear: both; }
        .comment-item { background: #f8fafc; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #3b82f6; font-size: 14px; }
        .comment-item span { font-size: 11px; color: #64748b; display: block; margin-top: 3px; }

        .form-card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #2a5298; max-width: 800px; margin: auto; }
        .form-card h2 { margin-top: 0; color: #1e3c72; border-bottom: 2px solid #ff9800; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; }
        .submit-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 14px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        .tree-container { 
            background: #fff; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            border-top: 5px solid #ff9800; 
            overflow: hidden;
        }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .pdf-btn { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 4px 12px rgba(255, 65, 108, 0.3); }
        .zoom-controls { display: flex; gap: 6px; align-items: center; }
        .zoom-btn { background: #2a5298; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        
        .chart-scroll-wrapper { 
            width: 100%; 
            height: 650px; 
            overflow: auto; 
            background: #f1f5f9; 
            border-radius: 12px; 
            padding: 30px; 
            position: relative;
        }

        #chart_wrapper_inner { 
            transform: scale(var(--tree-scale, 1));
            transform-origin: top center; 
            display: inline-block;
            width: max-content;
            transition: transform 0.1s ease-out;
            text-align: center;
        }

        .node-content-box { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            width: 120px !important; 
            min-height: 180px !important;
            padding: 12px 8px; 
            box-sizing: border-box; 
            text-align: center; 
            cursor: pointer;
            color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: 0.2s;
            border: 3px solid rgba(255, 255, 255, 0.4);
        }
        .node-content-box:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.35); }
        
        .gen-0-node { background: linear-gradient(135deg, #7209b7 0%, #3a0ca3 100%); }
        .gen-1-node { background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%); }
        .gen-2-node { background: linear-gradient(135deg, #f72585 0%, #b5179e 100%); }
        .gen-3-node { background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%); }
        .gen-4-node { background: linear-gradient(135deg, #f8961e 0%, #f3722c 100%); }

        .tree-root-node { display: flex; flex-direction: column; align-items: center; position: relative; }
        .tree-children-list { display: flex; justify-content: center; gap: 20px; margin-top: 0px; position: relative; }
        .tree-children-list::before { content: ''; position: absolute; top: 0px; left: 50%; transform: translateX(-50%); width: 2px; height: 15px; background: #2a5298; }
        .tree-child-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 15px; }
        .tree-child-wrapper::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #2a5298; }
        .tree-child-wrapper:first-child::before { left: 50%; }
        .tree-child-wrapper:last-child::before { right: 50%; }
        .tree-child-wrapper:only-child::before { display: none; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); overflow-y: auto; backdrop-filter: blur(5px); }
        .modal-content { 
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); 
            margin: 6% auto; 
            padding: 30px 25px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 480px; 
            position: relative; 
            border-top: 8px solid #11998e; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            animation: fadeInSlide 0.4s ease;
        }
        .close-btn { color: #555; float: right; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 20px; top: 12px; transition: 0.2s; }
        .close-btn:hover { color: #ff4757; }
        
        #cropperModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .cropper-container-box { background: #fff; width: 90%; max-width: 420px; margin: 8% auto; padding: 25px; border-radius: 16px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .img-container { max-height: 320px; margin-bottom: 20px; background: #000; border-radius: 8px; overflow: hidden; }
        .img-container img { max-width: 100%; display: block; }
        .crop-action-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border: none; padding: 12px 25px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4); }
    </style>
</head>

<body>

    <input type="file" id="popupPhotoFile" accept="image/*" style="display: none;" onchange="handleFileSelect(this)">

    <div id="cropperModal">
        <div class="cropper-container-box">
            <h3 style="margin-top:0; color:#1e3c72;" id="cropTitleText">फोटो क्रॉप करें (Crop & Set Profile)</h3>
            <div class="img-container"><img id="imageToCrop" src=""></div>
            <button class="crop-action-btn" onclick="getCroppedImage()" id="cropBtnText">Crop & Save Profile</button>
        </div>
    </div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBodyContent"></div>
        </div>
    </div>

    <div class="navbar">
        <button id="navTreeBtn" class="active" onclick="openTab(event, 'treePage')">🌳 Family Tree & Updates</button>
        <button id="navEntryBtn" onclick="openTab(event, 'entryPage')">➕ New Data Entry</button>
    </div>

    <div id="treePage" class="tab-content">
        
        <div class="top-feature-bar">
            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('langPanel')" id="langBtnText">🌐 Language (भाषा)</button>
                <div id="langPanel" class="dropdown-panel">
                    <label id="selectLangLabel">Select Language:</label>
                    <select id="langSelector" onchange="changeLanguage(this.value)">
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>

            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('tithiPanel')" id="tithiBtnText">📅 जन्मदिन / पुण्य तिथि</button>
                <div id="tithiPanel" class="dropdown-panel">
                    <label id="selectMemberLabel">सदस्य चुनें (Select Member):</label>
                    <select id="tithiSelectDropdown" onchange="selectMemberFromTithi(this.value)">
                        <option value="">-- लोड हो रहा है --</option>
                    </select>
                </div>
            </div>

            <div class="feature-dropdown-container">
                <button class="feature-btn" onclick="toggleDropdown('searchPanel')" id="searchBtnText">🔍 मेंबर सर्च (अगली पीढ़ी)</button>
                <div id="searchPanel" class="dropdown-panel">
                    <label id="searchMemberLabel">सदस्य सर्च करें:</label>
                    <select id="memberSearchDropdown" onchange="filterNextGenTree(this.value)">
                        <option value="">-- पूरा ट्री देखें --</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="event-slider-card" id="upcomingSliderWidget" style="text-align: center;">
            <div class="event-header-title" id="sliderHeaderTitle">✨ आगामी 7 दिन - जन्मदिन / पुण्य तिथि</div>
            <div class="slider-content-box" id="sliderBodyContainer">
                <p id="loadingText" style="color: #fff;">डाटा लोड हो रहा है...</p>
            </div>
        </div>

        <div class="comment-section-card">
            <h3 id="commentSectionTitle">💬 शुभकामनाएँ एवं संदेश (Comments Box)</h3>
            <textarea id="visitorComment" placeholder="अपनी शुभकामनाएँ या संदेश यहाँ लिखें..."></textarea>
            <button class="comment-submit-btn" id="sendMsgBtn" onclick="postComment()">संदेश भेजें</button>
            <div class="comments-display-list" id="commentsDisplayList">
                <p style="color:#64748b; font-size:13px; text-align:center; margin:10px 0;">कोई संदेश नहीं है। पहला संदेश आप भेजें!</p>
            </div>
        </div>

        <div class="tree-container">
            <div class="action-bar">
                <h2 style="margin:0; color:#1e3c72;" id="treeHeadingTitle">परिवार का स्वर्णिम इतिहास</h2>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomTree(0.1)" id="zoomPlusBtn">➕ ज़ूम+</button>
                        <button class="zoom-btn" onclick="zoomTree(-0.1)" id="zoomMinusBtn">➖ ज़ूम-</button>
                        <button class="zoom-btn" onclick="resetZoom()" id="zoomResetBtn">↺ रीसेट</button>
                    </div>
                    <button class="pdf-btn" onclick="downloadPDF()" id="pdfBtnText">📥 Save as PDF</button>
                </div>
            </div>
            
            <div id="pdfContent" style="background: #fff; padding: 20px; border-radius: 10px;">
                <h3 style="text-align: center; color: #1e3c72; display:none;" id="pdfTitle">Family Tree Report</h3>
                <div class="chart-scroll-wrapper" id="scrollWrapper">
                    <div id="chart_wrapper_inner">
                        <div id="tree_structure_div">
                            <div id="treeLoadingText" style="text-align:center; padding:50px; color:#666; font-weight:bold;">
                                Family Tree Load ho raha hai...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="entryPage" class="tab-content">
        <div class="form-card">
            <h2 id="formTitleText">Naye Member ki Entry Karein</h2>
            <form id="entryForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label id="lblMemberId">Member ID (ऑटो-जनरेटेड):</label>
                    <input type="text" id="memberIdField" readonly style="background-color: #e9ecef; font-weight: bold; color: #d9534f;">
                </div>
                <!-- बाकी फॉर्म फील्ड्स यहाँ आपके ओरिजिनल कोड के अनुसार रहेंगे -->
            </form>
        </div>
    </div>

    <script>
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE'; // यहाँ अपनी सही Google Apps Script URL डालें
        let allFamilyMembers = [];
        let currentScale = 1;

        window.onload = function() {
            loadFamilyData();
        };

        function loadFamilyData() {
            fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                if(data && data.length > 0) {
                    allFamilyMembers = data;
                    buildFamilyTree(data);
                } else {
                    document.getElementById('treeLoadingText').innerText = 'Family Tree me dikhane ke liye koi data nahi hai.';
                }
            })
            .catch(err => {
                console.error("Error loading data:", err);
                document.getElementById('treeLoadingText').innerText = 'Data load karne me samasya aayi.';
            });
        }

        // ट्री स्ट्रक्चर को वापस सही से रेंडर करने वाला फ़ंक्शन
        function buildFamilyTree(data, filterId = '') {
            let treeContainer = document.getElementById('tree_structure_div');
            if(!treeContainer) return;

            let targetData = data;
            if(filterId) {
                let matched = data.filter(d => d.memberId === filterId || d.fatherId === filterId);
                if(matched.length > 0) targetData = matched;
            }

            let roots = targetData.filter(m => !m.fatherId || m.fatherId === "" || !targetData.some(p => p.memberId === m.fatherId));
            if(roots.length === 0 && targetData.length > 0) roots = [targetData[0]];

            let html = '<div class="tree-root-node">';
            roots.forEach(root => {
                html += renderTreeNode(root, targetData, 0);
            });
            html += '</div>';

            treeContainer.innerHTML = html;
        }

        function renderTreeNode(node, data, genLevel) {
            let children = data.filter(m => m.fatherId === node.memberId);
            let genClass = `gen-${Math.min(genLevel, 4)}-node`;
            
            let photoTag = node.photo ? `<img src="${node.photo}" style="width:50px; height:50px; border-radius:50%; object-fit:cover; margin-bottom:6px; border:2px solid #fff;">` : `<div style="width:50px; height:50px; border-radius:50%; background:#fff; color:#333; display:flex; align-items:center; justify-content:center; font-weight:bold; margin:0 auto 6px auto;">${node.name.charAt(0)}</div>`;

            let html = `
                <div class="tree-root-node">
                    <div class="node-content-box ${genClass}" onclick="openMemberModal('${node.memberId}')">
                        ${photoTag}
                        <strong style="font-size:13px; display:block; margin-bottom:3px; word-break:break-word;">${node.name}</strong>
                        <span style="font-size:10px; opacity:0.8;">ID: ${node.memberId}</span>
                    </div>`;

            if(children.length > 0) {
                html += '<div class="tree-children-list">';
                children.forEach(child => {
                    html += `<div class="tree-child-wrapper">`;
                    html += renderTreeNode(child, data, genLevel + 1);
                    html += `</div>`;
                });
                html += '</div>';
            }

            html += `</div>`;
            return html;
        }

        function zoomTree(amount) {
            currentScale = Math.max(0.4, Math.min(1.8, currentScale + amount));
            document.getElementById('chart_wrapper_inner').style.setProperty('--tree-scale', currentScale);
        }

        function resetZoom() {
            currentScale = 1;
            document.getElementById('chart_wrapper_inner').style.setProperty('--tree-scale', currentScale);
        }

        function openTab(evt, tabName) {
            const contents = document.getElementsByClassName('tab-content');
            for (let c of contents) c.classList.remove('active');
            const buttons = document.getElementsByClassName('navbar')[0].getElementsByTagName('button');
            for (let b of buttons) b.classList.remove('active');
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function toggleDropdown(panelId) {
            let panel = document.getElementById(panelId);
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
