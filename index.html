<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Application</title>
    <!-- Cropper.js & html2pdf CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --tree-scale: 1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            background: #1e293b;
            padding: 10px;
            justify-content: center;
            gap: 10px;
        }
        .navbar button {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .navbar button.active, .navbar button:hover {
            background: #10b981;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }
        .modal-content {
            background: #ffffff;
            color: #0f172a;
            margin: 10% auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
        }
        .edit-profile-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .comment-item {
            background: #1e293b;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
        }
        .comment-item span {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }
        /* Tree container styling */
        #chart_wrapper_inner {
            transform: scale(var(--tree-scale));
            transform-origin: top center;
            transition: transform 0.2s ease;
        }
        .tree ul {
            padding-top: 20px; position: relative;
            transition: all 0.5s;
            display: flex;
            justify-content: center;
        }
        .tree li {
            float: left; text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.5s;
        }
        .tree li::before, .tree li::after {
            content: '';
            position: absolute; top: 0; right: 50%;
            border-top: 2px solid #cbd5e1;
            width: 50%; height: 20px;
        }
        .tree li::after {
            right: auto; left: 50%;
            border-left: 2px solid #cbd5e1;
        }
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after {
            border: 0;
        }
        .tree li:last-child::before {
            border-right: 2px solid #cbd5e1;
            border-radius: 0 5px 0 0;
        }
        .tree li:first-child::after {
            border-radius: 5px 0 0 0;
        }
        .tree ul ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; height: 20px;
        }
        .tree li a {
            border: 2px solid #cbd5e1;
            padding: 10px; display: inline-block;
            border-radius: 10px;
            background: #1e293b;
            color: #fff;
            text-decoration: none;
            min-width: 120px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .tree li a:hover {
            background: #334155;
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <button onclick="openTab(event, 'treePage')" id="navTreeBtn" class="active">Family Tree</button>
        <button onclick="openTab(event, 'formPage')">Add Member</button>
        <button onclick="openTab(event, 'eventsPage')">Events & Comments</button>
    </div>

    <!-- Tab 1: Family Tree -->
    <div id="treePage" class="tab-content active">
        <div style="text-align: center; margin-bottom: 15px;">
            <button onclick="zoomTree(0.2)">Zoom In (+)</button>
            <button onclick="zoomTree(-0.2)">Zoom Out (-)</button>
            <button onclick="resetZoom()">Reset</button>
            <button onclick="downloadPDF()">Download PDF</button>
        </div>
        <div id="pdfContent" style="overflow: auto; padding: 20px;">
            <h2 id="pdfTitle" style="display:none; text-align:center; color:#0f172a;">Family Tree Report</h2>
            <div id="chart_wrapper_inner">
                <p id="treeLoadingText" style="text-align: center;">Loading Family Tree...</p>
                <div class="tree" id="tree_structure_div"></div>
            </div>
        </div>
    </div>

    <!-- Tab 2: Add Member Form -->
    <div id="formPage" class="tab-content">
        <h2>Add Family Member</h2>
        <form id="entryForm" onsubmit="submitForm(event)">
            <div>
                <label id="selectLangLabel">Language</label>
            </div>
            <div>
                <label id="selectMemberLabel">Select Parent</label>
                <select id="fatherId" style="width: 100%; padding: 8px; margin-bottom: 10px;"></select>
            </div>
            <div>
                <label id="searchMemberLabel">Member ID</label>
                <input type="text" id="memberIdField" readonly style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label>Name</label>
                <input type="text" id="name" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label>Date of Birth</label>
                <input type="date" id="dob" style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label>Status (Alive/Death)</label>
                <select id="aliveDeath" onchange="toggleDeathFields('member')" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                    <option value="Alive">Alive</option>
                    <option value="Death">Death</option>
                </select>
            </div>
            <div id="memberDeathContainer" style="display:none;">
                <label>Death Anniversary Date</label>
                <input type="date" id="deathAnniversary" onchange="calculateDeathDay(this.value, 'deathDay')" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                <label>Death Day</label>
                <input type="text" id="deathDay" style="width: 100%; padding: 8px; margin-bottom: 10px;" readonly>
                <label>Death Tithi</label>
                <input type="text" id="deathTithi" style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label>Marital Status</label>
                <select id="maritalStatus" onchange="toggleSpouseFields()" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                    <option value="Unmarried">Unmarried</option>
                    <option value="Married">Married</option>
                </select>
            </div>
            <div id="spouseFieldsContainer" style="display:none;">
                <label>Spouse Name</label>
                <input type="text" id="spouseName" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                <label>Spouse DOB</label>
                <input type="date" id="spouseDob" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                <label>Spouse Status</label>
                <select id="spouseAliveStatus" onchange="toggleDeathFields('spouse')" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                    <option value="Alive">Alive</option>
                    <option value="Death">Death</option>
                </select>
                <div id="spouseDeathContainer" style="display:none;">
                    <label>Spouse Death Date</label>
                    <input type="date" id="spouseDeathAnniv" onchange="calculateDeathDay(this.value, 'spouseDeathDay')" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                    <label>Spouse Death Day</label>
                    <input type="text" id="spouseDeathDay" style="width: 100%; padding: 8px; margin-bottom: 10px;" readonly>
                    <label>Spouse Death Tithi</label>
                    <input type="text" id="spouseDeathTithi" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                </div>
            </div>
            <div>
                <label>Gender</label>
                <select id="gender" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div>
                <label>Mobile</label>
                <input type="text" id="mobile" style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label>Child Number (क्रम)</label>
                <input type="number" id="childNumber" style="width: 100%; padding: 8px; margin-bottom: 10px;">
            </div>
            <div>
                <label>Photo</label>
                <input type="file" id="photoFile" accept="image/*" style="width: 100%; padding: 8px; margin-bottom: 15px;">
            </div>
            <button type="submit" id="submitBtnText" class="edit-profile-btn" style="width: 100%; padding: 10px;">Save Details</button>
        </form>
    </div>

    <!-- Tab 3: Events & Comments -->
    <div id="eventsPage" class="tab-content">
        <h2>Upcoming Events & Visitor Comments</h2>
        <div id="sliderBodyContainer" style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <!-- Slider dynamically loaded -->
        </div>
        <div>
            <h3>Leave a Wish / Comment</h3>
            <textarea id="visitorComment" placeholder="Write your message here..." style="width: 100%; height: 80px; padding: 8px; border-radius: 6px; background: #1e293b; color: white; border: 1px solid #334155;"></textarea>
            <button onclick="postComment()" class="edit-profile-btn" style="margin-top: 10px;">Post Comment</button>
        </div>
        <div style="margin-top: 20px;">
            <h3>Recent Comments</h3>
            <div id="commentsDisplayList"></div>
        </div>
    </div>

    <!-- Member Details Modal -->
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBodyContent"></div>
        </div>
    </div>

    <!-- Hidden file input for cropping -->
    <input type="file" id="popupPhotoFile" accept="image/*" style="display:none;" onchange="handleFileSelect(this)">

    <!-- Cropper Modal -->
    <div id="cropperModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <h3>Crop Photo</h3>
            <div style="max-height: 350px; overflow: hidden;">
                <img id="imageToCrop" style="max-width: 100%;">
            </div>
            <button onclick="getCroppedImage()" class="edit-profile-btn" style="margin-top: 15px; width: 100%;">Crop & Save</button>
        </div>
    </div>

    <script>
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE'; // यहाँ अपनी सही गूगल स्क्रिप्ट URL डालें
        let allFamilyMembers = [];
        let upcomingEventsList = [];
        let currentSlideIndex = 0;
        let sliderInterval = null;
        let currentScale = 1;
        let cropper = null;
        let selectedMemberForProfileCrop = '';

        window.onload = function() {
            generateMemberId();
            loadFamilyData();
            loadComments();
        };

        function generateMemberId() {
            let randomId = 'MEM' + Math.floor(1000 + Math.random() * 9000);
            let field = document.getElementById('memberIdField');
            if(field) field.value = randomId;
        }

        function loadFamilyData() {
            fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                if(data && data.length > 0) {
                    allFamilyMembers = data;
                    populateDropdowns(data);
                    buildFamilyTree(data);
                    setupUpcomingEvents(data);
                } else {
                    document.getElementById('sliderBodyContainer').innerHTML = '<p style="color: #fff;">Google Sheet me koi data nahi mila. Pehli entry karein!</p>';
                    document.getElementById('treeLoadingText').innerText = 'Family Tree me dikhane ke liye koi data nahi hai.';
                }
            })
            .catch(err => {
                console.error("Error loading data:", err);
                document.getElementById('sliderBodyContainer').innerHTML = '<p style="color: #ff6b6b;">Data load karne me samasya aayi.</p>';
            });
        }

        function populateDropdowns(data) {
            let fatherSelect = document.getElementById('fatherId');
            fatherSelect.innerHTML = '<option value="">-- Root (No Father) --</option>';

            data.forEach(m => {
                fatherSelect.innerHTML += `<option value="${m.memberId}">${m.name} (${m.memberId})</option>`;
            });
        }

        function buildFamilyTree(data, filterId = '') {
            let treeContainer = document.getElementById('tree_structure_div');
            if(!treeContainer) return;

            let targetData = data;
            if(filterId) {
                let matched = data.filter(d => d.memberId === filterId || d.fatherId === filterId);
                if(matched.length > 0) targetData = matched;
            }

            let roots = targetData.filter(m => !m.fatherId || m.fatherId === "" || !targetData.some(p => p.memberId === m.fatherId));
            if(roots.length === 0 && targetData.length > 0) roots = [targetData[0]];

            let html = '<ul>';
            roots.forEach(root => {
                html += renderTreeNode(root, targetData);
            });
            html += '</ul>';

            treeContainer.innerHTML = html;
            let loadingDiv = document.getElementById('treeLoadingText');
            if(loadingDiv) loadingDiv.style.display = 'none';
        }

        // ट्री नोड को रिकर्सिव रूप से रेंडर करने वाला मुख्य फ़ंक्शन (जो मिसिंग था)
        function renderTreeNode(node, data) {
            let children = data.filter(m => m.fatherId === node.memberId);
            
            let photoTag = node.photo ? `<img src="${node.photo}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; margin-bottom:5px; display:block; margin-left:auto; margin-right:auto;">` : '';
            
            let html = `<li>
                <a href="javascript:void(0)" onclick="openMemberModal('${node.memberId}')">
                    ${photoTag}
                    <strong>${node.name}</strong><br>
                    <span style="font-size:11px; color:#94a3b8;">ID: ${node.memberId}</span>
                </a>`;

            if(children.length > 0) {
                html += '<ul>';
                children.forEach(child => {
                    html += renderTreeNode(child, data);
                });
                html += '</ul>';
            }

            html += '</li>';
            return html;
        }

        function zoomTree(amount) {
            currentScale = Math.max(0.4, Math.min(1.8, currentScale + amount));
            document.getElementById('chart_wrapper_inner').style.setProperty('--tree-scale', currentScale);
        }

        function resetZoom() {
            currentScale = 1;
            document.getElementById('chart_wrapper_inner').style.setProperty('--tree-scale', currentScale);
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            document.getElementById('pdfTitle').style.display = 'block';
            let opt = {
                margin: 10,
                filename: 'Family_Tree_Report.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().from(element).set(opt).save().then(() => {
                document.getElementById('pdfTitle').style.display = 'none';
            });
        }

        function isWithinNext7Days(dateStr) {
            if (!dateStr) return false;
            let today = new Date();
            today.setHours(0,0,0,0);

            let parts = dateStr.split('-');
            if (parts.length < 2) return false;
            let month = parseInt(parts[parts.length - 2], 10) - 1;
            let day = parseInt(parts[parts.length - 1], 10);

            let eventThisYear = new Date(today.getFullYear(), month, day);
            eventThisYear.setHours(0,0,0,0);

            if (eventThisYear < today) {
                eventThisYear.setFullYear(today.getFullYear() + 1);
            }

            let diffTime = eventThisYear - today;
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            return (diffDays >= 0 && diffDays <= 7);
        }

        function setupUpcomingEvents(data) {
            upcomingEventsList = [];
            
            data.forEach(m => {
                let memberEventFound = false;
                if (m.aliveDeath === 'Death' && isWithinNext7Days(m.deathAnniversary)) {
                    upcomingEventsList.push({
                        member: m,
                        targetName: m.name,
                        eventType: 'पुण्यतिथि (Death Anniversary)',
                        dateVal: m.deathAnniversary,
                        dayVal: m.deathDay || '',
                        tithiVal: m.deathTithi || ''
                    });
                    memberEventFound = true;
                }
                if (!memberEventFound && isWithinNext7Days(m.dob)) {
                    upcomingEventsList.push({
                        member: m,
                        targetName: m.name,
                        eventType: 'जन्मदिन (Birthday)',
                        dateVal: m.dob,
                        dayVal: '',
                        tithiVal: ''
                    });
                }
                if (m.maritalStatus === 'Married') {
                    let spouseEventFound = false;
                    if (m.spouseAliveDeath === 'Death' && isWithinNext7Days(m.spouseDeathAnniv)) {
                        upcomingEventsList.push({
                            member: m,
                            targetName: `${m.spouseName} (जीवनसाथी - ${m.name})`,
                            eventType: 'पुण्यतिथि (Spouse Death Anniversary)',
                            dateVal: m.spouseDeathAnniv,
                            dayVal: m.spouseDeathDay || '',
                            tithiVal: m.spouseDeathTithi || ''
                        });
                        spouseEventFound = true;
                    }
                    if (!spouseEventFound && isWithinNext7Days(m.spouseDob)) {
                        upcomingEventsList.push({
                            member: m,
                            targetName: `${m.spouseName} (जीवनसाथी - ${m.name})`,
                            eventType: 'जन्मदिन (Spouse Birthday)',
                            dateVal: m.spouseDob,
                            dayVal: '',
                            tithiVal: ''
                        });
                    }
                }
            });

            let container = document.getElementById('sliderBodyContainer');
            if(upcomingEventsList.length === 0) {
                container.innerHTML = '<p style="color: #fff; font-size: 15px; padding: 20px;">आगामी 7 दिनों में कोई जन्मदिन या पुण्यतिथि नहीं है।</p>';
                if(sliderInterval) clearInterval(sliderInterval);
                return;
            }

            currentSlideIndex = 0;
            renderEventSlide(currentSlideIndex);
            if(sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => {
                currentSlideIndex = (currentSlideIndex + 1) % upcomingEventsList.length;
                renderEventSlide(currentSlideIndex);
            }, 6000);
        }

        function renderEventSlide(index) {
            let ev = upcomingEventsList[index];
            let m = ev.member;
            let container = document.getElementById('sliderBodyContainer');
            let photoSrc = m.photo ? m.photo : 'https://via.placeholder.com/150/1e3c72/ffffff?text=No+Photo';
            
            container.innerHTML = `
                <div>
                    <img src="${photoSrc}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; float:left; margin-right:15px;">
                    <h3 style="margin:0 0 5px 0; font-size:18px;">${ev.eventType}</h3>
                    <p style="margin:2px 0;"><strong>नाम:</strong> ${ev.targetName}</p>
                    <p style="margin:2px 0;"><strong>दिनांक:</strong> ${ev.dateVal || 'N/A'}</p>
                    <button class="edit-profile-btn" style="margin-top:8px;" onclick="openMemberModal('${m.memberId}')">पूरी जानकारी देखें</button>
                </div>
            `;
        }

        function postComment() {
            let msgBox = document.getElementById('visitorComment');
            let text = msgBox.value.trim();
            if(!text) {
                alert('कृपया शुभकामना संदेश लिखें!');
                return;
            }

            let comments = JSON.parse(localStorage.getItem('family_comments') || '[]');
            let newMsg = {
                text: text,
                time: new Date().toLocaleString('hi-IN'),
                timestamp: new Date().getTime()
            };
            comments.unshift(newMsg);
            localStorage.setItem('family_comments', JSON.stringify(comments));
            msgBox.value = '';
            loadComments();
        }

        function loadComments() {
            let listContainer = document.getElementById('commentsDisplayList');
            let comments = JSON.parse(localStorage.getItem('family_comments') || '[]');
            
            let now = new Date().getTime();
            let sevenDaysInMillis = 7 * 24 * 60 * 60 * 1000;

            comments = comments.filter(c => {
                if (!c.timestamp) return true;
                return (now - c.timestamp) < sevenDaysInMillis;
            });

            localStorage.setItem('family_comments', JSON.stringify(comments));

            if(comments.length === 0) {
                listContainer.innerHTML = '<p style="color:#64748b; font-size:13px; text-align:center;">कोई संदेश नहीं है।</p>';
                return;
            }

            let html = '';
            comments.forEach(c => {
                html += `
                    <div class="comment-item">
                        ${c.text}
                        <span>🕒 ${c.time}</span>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function openMemberModal(memberId) {
            let m = allFamilyMembers.find(item => item.memberId === memberId);
            if(!m) return;
            
            let modal = document.getElementById('memberModal');
            let body = document.getElementById('modalBodyContent');
            
            let photoHtml = m.photo ? `<img src="${m.photo}" style="width:110px; height:110px; border-radius:50%; object-fit:cover; border:4px solid #10b981; margin:0 auto 15px auto; display:block;">` : '';

            body.innerHTML = `
                ${photoHtml}
                <h3 style="text-align:center; color:#0f172a; margin-top:0;">${m.name}</h3>
                <p><strong>Member ID:</strong> ${m.memberId}</p>
                <p><strong>Father ID:</strong> ${m.fatherId || 'Root'}</p>
                <p><strong>Gender:</strong> ${m.gender}</p>
                <p><strong>D.O.B:</strong> ${m.dob || 'N/A'}</p>
                <p><strong>Status:</strong> ${m.aliveDeath}</p>
                <p><strong>Marital Status:</strong> ${m.maritalStatus}</p>
                <p><strong>Mobile:</strong> ${m.mobile || 'N/A'}</p>
                <button class="edit-profile-btn" style="width:100%; margin-top:15px;" onclick="openProfileCropModal('${m.memberId}')">📷 फोटो बदलें / Crop करें</button>
            `;
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = 'none';
        }

        function openProfileCropModal(memberId) {
            selectedMemberForProfileCrop = memberId;
            closeModal();
            document.getElementById('popupPhotoFile').click();
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('imageToCrop').src = e.target.result;
                    document.getElementById('cropperModal').style.display = 'block';
                    if (cropper) cropper.destroy();
                    let image = document.getElementById('imageToCrop');
                    cropper = new Cropper(image, { aspectRatio: 1, viewMode: 1 });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCroppedImage() {
            if (!cropper) return;
            let canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
            let croppedBase64 = canvas.toDataURL('image/jpeg');
            
            let member = allFamilyMembers.find(m => m.memberId === selectedMemberForProfileCrop);
            if(member) {
                member.photo = croppedBase64;
                setupUpcomingEvents(allFamilyMembers);
                buildFamilyTree(allFamilyMembers);
                alert('प्रोफाइल फोटो सफलतापूर्वक अपडेट कर ली गई है!');
            }
            
            document.getElementById('cropperModal').style.display = 'none';
            if (cropper) cropper.destroy();
        }

        function toggleDeathFields(type) {
            if (type === 'member') {
                const status = document.getElementById('aliveDeath').value;
                document.getElementById('memberDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            } else if (type === 'spouse') {
                const status = document.getElementById('spouseAliveStatus').value;
                document.getElementById('spouseDeathContainer').style.display = (status === 'Death') ? 'block' : 'none';
            }
        }

        function toggleSpouseFields() {
            const status = document.getElementById('maritalStatus').value;
            document.getElementById('spouseFieldsContainer').style.display = (status === 'Married') ? 'block' : 'none';
        }

        function openTab(evt, tabName) {
            const contents = document.getElementsByClassName('tab-content');
            for (let c of contents) c.classList.remove('active');
            const buttons = document.getElementsByClassName('navbar')[0].getElementsByTagName('button');
            for (let b of buttons) b.classList.remove('active');
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function calculateDeathDay(dateStr, targetFieldId) {
            if(!dateStr) return;
            let date = new Date(dateStr);
            let days = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];
            let dayName = days[date.getDay()];
            let targetField = document.getElementById(targetFieldId);
            if(targetField) targetField.value = dayName;
        }

        function submitForm(event) {
            event.preventDefault();
            let photoInput = document.getElementById('photoFile');
            let file = photoInput.files[0];

            if (file) {
                let reader = new FileReader();
                reader.onload = function () {
                    sendDataToGoogleSheet(reader.result);
                };
                reader.readAsDataURL(file);
            } else {
                sendDataToGoogleSheet('');
            }
        }

        function sendDataToGoogleSheet(base64Photo) {
            let newMem = {
                fatherId: document.getElementById('fatherId').value,
                memberId: document.getElementById('memberIdField').value,
                name: document.getElementById('name').value,
                dob: document.getElementById('dob').value,
                aliveDeath: document.getElementById('aliveDeath').value,
                deathAnniversary: document.getElementById('deathAnniversary').value,
                deathDay: document.getElementById('deathDay').value,
                deathTithi: document.getElementById('deathTithi').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                spouseName: document.getElementById('spouseName').value,
                spouseDob: document.getElementById('spouseDob').value,
                spouseAliveDeath: document.getElementById('spouseAliveStatus').value,
                spouseDeathAnniv: document.getElementById('spouseDeathAnniv').value,
                spouseDeathDay: document.getElementById('spouseDeathDay').value,
                spouseDeathTithi: document.getElementById('spouseDeathTithi').value,
                gender: document.getElementById('gender').value,
                mobile: document.getElementById('mobile').value,
                childNumber: document.getElementById('childNumber').value,
                photo: base64Photo
            };

            let submitBtn = document.getElementById('submitBtnText');
            submitBtn.innerText = "Saving to Google Sheet...";
            submitBtn.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newMem)
            })
            .then(() => {
                alert('नया डेटा सफलतापूर्वक Google Sheet में सेव हो गया है!');
                document.getElementById('entryForm').reset();
                generateMemberId();
                submitBtn.innerText = "Save Details";
                submitBtn.disabled = false;
                
                loadFamilyData();
                openTab({ currentTarget: document.getElementById('navTreeBtn') }, 'treePage');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('डेटा सेव करने में त्रुटि हुई!');
                submitBtn.innerText = "Save Details";
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
